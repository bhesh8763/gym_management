# Render blueprint: one web service (Django API + static frontend served by
# whitenoise from the site root) + managed Postgres, Singapore region.
# Deploy: Dashboard -> New -> Blueprint -> pick this repo.
#
# NOTE: Render appended a suffix to the service name (name was taken), so the
# real hostname is fitcore-k5zr.onrender.com, not fitcore.onrender.com.
# settings.py ALSO auto-appends RENDER_EXTERNAL_HOSTNAME to ALLOWED_HOSTS /
# CSRF_TRUSTED_ORIGINS, so only FRONTEND_URL below needs a manual update if the
# hostname ever changes again.

databases:
  - name: fitcore-db
    # MUST match the service region — Render's internal DNS/private network
    # is per-region, and the region default is "oregon" (can't change later).
    region: singapore
    databaseName: gym_db
    user: gym_user
    # Free Postgres is a time-limited trial on Render; switch to a paid plan
    # before it expires, or point DB_* env vars at Neon/Supabase instead.
    plan: free

services:
  - type: web
    name: fitcore
    runtime: python
    region: singapore
    # Free web services sleep after inactivity; upgrade to "starter" for always-on.
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Free tier doesn't support preDeployCommand, so migrate at boot
    # (no-op once applied) before gunicorn starts accepting traffic.
    # --bind 0.0.0.0:$PORT: Render health-checks its own assigned port;
    # gunicorn's default (127.0.0.1:8000) is never reachable -> deploy timeout.
    startCommand: python manage.py migrate && gunicorn gym_management.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: fitcore-k5zr.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://fitcore-k5zr.onrender.com
      - key: FRONTEND_URL
        value: https://fitcore-k5zr.onrender.com
      - key: TRUST_X_FORWARDED_PROTO
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      # Enable after the first green deploy (redirects can confuse health checks):
      - key: SECURE_SSL_REDIRECT
        value: "False"
      # DB_* consumed by gym_management/settings.py (python-decouple).
      - key: DB_HOST
        fromDatabase:
          name: fitcore-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fitcore-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: fitcore-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: fitcore-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fitcore-db
          property: password
    # Persistent disk for media/ (profile pictures, equipment photos, staff
    # ID docs) — requires a paid instance; until then uploads are ephemeral
    # and disappear on redeploy.
    # disk:
    #   name: media
    #   mountPath: /opt/render/project/src/media
    #   sizeGB: 1
