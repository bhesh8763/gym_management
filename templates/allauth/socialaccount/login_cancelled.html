<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Cancelled — FitCore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f4f4f6; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 20px; padding: 3rem; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.1); text-align: center; }
    .icon { font-size: 3rem; color: #f59e0b; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #1a1a1f; margin-bottom: 0.5rem; }
    p { color: #6c6c78; font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.5; }
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.85rem 1.5rem; background: linear-gradient(135deg, #e63946, #b32d3a); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; font-family: inherit; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(230,57,70,0.35); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon"><i class="bi bi-exclamation-triangle"></i></div>
    <h1>Login Cancelled</h1>
    <p>The sign-in process was cancelled. You can try again or go back to the login page.</p>
    <a href="http://localhost:5500/login.html" class="btn"><i class="bi bi-arrow-left"></i> Back to Login</a>
  </div>
</body>
</html>
