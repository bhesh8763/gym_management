<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — FitCore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f4f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 3rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      border-radius: 16px;
      overflow: hidden;
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; }
    .provider-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #fff;
    }
    .provider-google { background: #4285F4; }
    .provider-facebook { background: #1877F2; }
    .provider-twitter { background: #000; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #1a1a1f; margin-bottom: 0.5rem; }
    p { color: #6c6c78; font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.5; }
    .btn-continue {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.85rem 1.5rem;
      background: linear-gradient(135deg, #e63946, #b32d3a);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn-continue:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(230,57,70,0.35);
    }
    .back-link {
      display: block;
      margin-top: 1.25rem;
      color: #6c6c78;
      font-size: 0.85rem;
      text-decoration: none;
    }
    .back-link:hover { color: #e63946; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/static/logo.png" alt="FitCore" onerror="this.style.display='none'">
    </div>

    <div class="provider-icon provider-{{ provider.id }}">
      {% if provider.id == 'google' %}
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#fff"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#fff" opacity="0.8"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#fff" opacity="0.6"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#fff"/></svg>
      {% elif provider.id == 'facebook' %}
        <i class="bi bi-facebook"></i>
      {% else %}
        <i class="bi bi-twitter-x"></i>
      {% endif %}
    </div>

    <h1>Sign In Via {{ provider.name }}</h1>
    <p>You are about to sign in using a third-party account from <strong>{{ provider.name }}</strong>.</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn-continue">
        Continue with {{ provider.name }}
        <i class="bi bi-arrow-right-short"></i>
      </button>
    </form>

    <a href="javascript:history.back()" class="back-link"><i class="bi bi-arrow-left"></i> Go back</a>
  </div>
</body>
</html>
