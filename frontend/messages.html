<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — FitCore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body>

<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;">
  <div id="appToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="appToastBody">Saved.</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<nav class="topbar">
  <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
  <a href="dashboard.html" class="navbar-brand d-flex align-items-center text-decoration-none">
    <img src="logo.png" alt="FitCore" style="height:32px;width:32px;margin-right:8px;object-fit:contain;">
    <span style="font-size: 1.5rem; font-weight: 700;">FitCore</span>
  </a>
  <div class="topbar-search" id="topbarSearchArea">
    <i class="bi bi-search"></i>
    <input type="text" id="globalSearch" placeholder="Search members by name, ID, or phone..." autocomplete="off">
    <div class="topbar-search-results" id="globalSearchResults"></div>
  </div>
  <div class="position-relative">
    <button class="topbar-icon-btn" onclick="toggleDropdown('notifPanel')">
      <i class="bi bi-bell"></i>
      <span class="notif-badge" id="notifCount" style="display:none;">0</span>
    </button>
    <div class="dropdown-panel" id="notifPanel">
      <div class="d-flex justify-content-between align-items-center px-3 pt-2 pb-1 border-bottom">
        <span class="fw-semibold small">Notifications</span>
        <button id="notifMarkAllBtn" class="btn btn-sm btn-link text-danger p-0 small" onclick="markAllTopbarNotificationsRead()" disabled>
          <i class="bi bi-check2-all me-1"></i>Mark all as read
        </button>
      </div>
      <div id="notifList"><div class="notif-empty">No notifications</div></div>
      <div class="border-top text-center py-2">
        <a href="notifications.html" class="small text-danger spa-link">View all</a>
      </div>
    </div>
  </div>
  <div class="position-relative">
    <button class="profile-trigger" onclick="toggleDropdown('profilePanel')">
      <span class="profile-avatar" id="profileAvatar">?</span>
      <span class="profile-meta">
        <div class="profile-name" id="profileName">–</div>
        <div class="profile-role" id="profileRole">–</div>
      </span>
      <i class="bi bi-chevron-down text-white-50"></i>
    </button>
    <div class="dropdown-panel profile-menu" id="profilePanel">
      <a href="javascript:void(0)" onclick="openEditProfileModal()"><i class="bi bi-person"></i> Profile</a>
      <hr>
      <button class="text-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </div>
</nav>

<div id="page-content">
<div class="d-flex">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar"></div>

  <div class="flex-grow-1">
    <div class="msg-page" id="msgPage">

      <!-- Left: Conversation List -->
      <div class="msg-list-panel">
        <div class="msg-list-header">
          <div class="d-flex justify-content-between align-items-center">
            <h5><i class="bi bi-chat-dots me-2" style="color:var(--brand-red);"></i>Messages</h5>
            <span class="badge bg-danger d-none" id="totalUnreadBadge">0</span>
          </div>
        </div>
        <div class="msg-search">
          <input type="text" id="msgSearch" placeholder="Search conversations..." oninput="filterConversations()">
        </div>
        <div class="msg-list" id="conversationList">
          <div class="text-center py-4"><div class="spinner-border spinner-border-sm text-danger"></div></div>
        </div>
      </div>

      <!-- Right: Chat Panel -->
      <div class="msg-chat-panel">
        <div class="msg-no-chat" id="noChatPlaceholder">
          <div class="msg-no-chat-inner">
            <i class="bi bi-chat-dots"></i>
            <div style="font-size:1rem;font-weight:600;margin-bottom:4px;">Select a conversation</div>
            <div class="msg-no-chat-hint" style="font-size:0.82rem;">Choose someone from the list to view messages</div>
          </div>
        </div>

        <div id="chatView" style="display:none;flex-direction:column;height:100%;">
          <div class="msg-chat-header">
            <button class="msg-back-btn" onclick="showListPanel()"><i class="bi bi-arrow-left"></i></button>
            <div class="msg-chat-avatar" id="chatAvatar">?</div>
            <div style="flex:1;min-width:0;">
              <div class="msg-chat-name" id="chatName"></div>
              <div class="msg-chat-sub" id="chatSub">0 messages</div>
            </div>
            <button class="msg-chat-pin-btn" id="chatPinBtn" onclick="togglePin()" title="Pin conversation" style="display:none;">
              <i class="bi bi-pin"></i>
            </button>
            <button class="msg-chat-pin-btn" id="chatDeleteBtn" onclick="deleteConversation()" title="Delete conversation" style="display:none;color:var(--brand-red,#e63946);">
              <i class="bi bi-trash"></i>
            </button>
          </div>
          <div class="msg-chat-body" id="chatBody">
            <div class="msg-chat-empty">
              <i class="bi bi-chat-dots"></i>
              <div>No messages yet</div>
            </div>
          </div>
          <div class="msg-chat-footer">
            <div class="msg-reply-row">
              <textarea id="replyInput" rows="1" placeholder="Type a message..." onkeydown="handleReplyKeydown(event)"></textarea>
              <button class="btn-send" id="sendBtn" onclick="sendReply()" disabled>
                <i class="bi bi-send-fill"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
</div>

<!-- New Message Modal -->
<div class="modal fade" id="newMsgModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-chat-dots me-2"></i>New Message</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">To</label>
          <select id="newMsgRecipient" class="form-select">
            <option value="">Loading...</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea id="newMsgText" class="form-control" rows="4" placeholder="Type your message here..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="sendNewMessage()"><i class="bi bi-send me-1"></i>Send</button>
      </div>
    </div>
  </div>
</div>

<!-- New Group Modal (trainers / staff / owner only) -->
<div class="modal fade" id="newGroupModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-people me-2"></i>New Group</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Group name</label>
          <input type="text" id="newGroupName" class="form-control" placeholder="e.g. Monday Bootcamp" maxlength="150">
        </div>
        <div class="mb-1">
          <label class="form-label">Members</label>
          <div id="newGroupMembers" class="group-member-list" style="max-height:260px;overflow-y:auto;border:1px solid var(--border-light,#e5e7eb);border-radius:8px;padding:10px;">
            <div class="text-center py-3"><div class="spinner-border spinner-border-sm text-danger"></div></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="createGroup()"><i class="bi bi-people me-1"></i>Create Group</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
if (!getAccessToken()) window.location.href = 'login.html';

// ── Role detection ─────────────────────────────────────────────────────
const USER_ROLE = localStorage.getItem('user_role') || '';
const IS_MEMBER = USER_ROLE === 'MEMBER';
const IS_STAFF_LIKE = ['OWNER', 'STAFF', 'TRAINER'].includes(USER_ROLE);

// Set active sidebar page
buildSidebar('messages');

// ── State ──────────────────────────────────────────────────────────────
let allMessages = [];          // direct messages from the server
let conversations = {};        // direct conversations keyed by otherPartyId
let groups = [];               // group chats the user belongs to
let groupMessagesCache = {};   // groupId -> messages
let selectedId = null;         // selected direct conversation key
let selectedGroupId = null;    // selected group id
let selectedKind = null;       // 'direct' | 'group'
let pins = {};                 // 'kind:targetId' -> true (pinned conversations)
let editingMessageId = null;   // message currently being edited in the open chat
const MY_ID = parseInt(localStorage.getItem('user_id')) || 0;
const CAN_CREATE_GROUP = USER_ROLE !== 'MEMBER'; // trainers, staff, owner

// Remove role-specific code that's no longer needed
// IS_MEMBER and IS_STAFF_LIKE are kept for backend API routing only

// ── Helpers ────────────────────────────────────────────────────────────
function timeAgo(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if (diff < 60) return 'Just now';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
  return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatDateDivider(dateStr) {
  const d = new Date(dateStr);
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}

function showToast(msg, variant) {
  const t = document.getElementById('appToast');
  const b = document.getElementById('appToastBody');
  if (!t || !b) return;
  t.classList.remove('bg-success', 'bg-danger');
  t.classList.add(variant === 'error' ? 'bg-danger' : 'bg-success');
  b.textContent = msg;
  bootstrap.Toast.getOrCreateInstance(t, { delay: 2800 }).show();
}

function pinKey(kind, id) { return kind + ':' + id; }

function isPinned(kind, id) { return !!pins[pinKey(kind, id)]; }

// ── Load messages ──────────────────────────────────────────────────────
async function loadMessages() {
  const [res, groupRes, pinRes] = await Promise.all([
    apiRequest('/workouts/trainer-messages/'),
    apiRequest('/workouts/message-groups/'),
    apiRequest('/workouts/message-pins/'),
  ]);
  if (res && res.ok) allMessages = await res.json();
  if (groupRes && groupRes.ok) groups = await groupRes.json();
  if (pinRes && pinRes.ok) {
    const p = await pinRes.json();
    pins = {};
    p.forEach(x => { pins[pinKey(x.kind, x.target_id)] = true; });
  }
  groupConversations();
  renderConversationList();
  if (selectedKind === 'group' && selectedGroupId) {
    loadGroupMessages(selectedGroupId);
    renderGroupChat();
  } else if (selectedKind === 'direct' && selectedId) {
    renderChat();
  }
}

function groupConversations() {
  conversations = {};
  allMessages.forEach(m => {
    // "Mine" = the sender is the current user (works for every role pairing)
    const isMine = Number(m.sender_id) === MY_ID;
    // Determine the other party in this conversation:
    // - If I sent it (isMine): other party = recipient_id
    // - If from others: other party = sender_id
    const otherId = isMine ? m.recipient_id : m.sender_id;
    const otherName = isMine ? (m.recipient_name || '') : (m.sender_name || '');
    if (!otherId) return;
    if (!conversations[otherId]) {
      conversations[otherId] = { name: otherName, messages: [], unread: 0 };
    }
    conversations[otherId].messages.push(m);
    // Unread = messages from the OTHER person
    const isFromOther = !isMine;
    if (!m.is_read && isFromOther) conversations[otherId].unread++;
    // Update name from their messages
    if (isFromOther && otherName) {
      conversations[otherId].name = otherName;
    }
  });
}

// ── Render conversation list (direct + groups) ─────────────────────────
function renderConversationList() {
  const el = document.getElementById('conversationList');
  const directUnread = Object.values(conversations).reduce((s, c) => s + c.unread, 0);
  const groupUnread = groups.reduce((s, g) => s + (g.unread_count || 0), 0);
  const totalUnread = directUnread + groupUnread;
  const badge = document.getElementById('totalUnreadBadge');

  if (totalUnread > 0) {
    badge.textContent = totalUnread;
    badge.classList.remove('d-none');
  } else {
    badge.classList.add('d-none');
  }

  // Build one sorted list of items (direct conversations + groups)
  const items = [];
  Object.keys(conversations).forEach(id => {
    const conv = conversations[id];
    const lastMsg = conv.messages[conv.messages.length - 1];
    items.push({
      kind: 'direct',
      id,
      name: conv.name,
      unread: conv.unread,
      lastTime: lastMsg.created_at,
      lastMsg,
      lastSender: (Number(lastMsg.sender_id) === MY_ID) ? 'You' : conv.name,
      pinned: isPinned('direct', id),
    });
  });
  groups.forEach(g => {
    items.push({
      kind: 'group',
      id: g.id,
      name: g.name,
      unread: g.unread_count || 0,
      lastTime: g.last_created_at,
      lastMsg: { message: g.last_message || '' },
      lastSender: g.last_sender_name || '',
      memberCount: (g.member_ids || []).length,
      memberNames: g.member_names || {},
      pinned: isPinned('group', g.id),
    });
  });

  if (!items.length) {
    el.innerHTML = '<div class="msg-empty-list"><i class="bi bi-chat-dots"></i>No conversations yet.<br>Click <strong>New</strong> to start a conversation.</div>';
    return;
  }

  items.sort((a, b) => {
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    const tA = a.lastTime ? new Date(a.lastTime).getTime() : 0;
    const tB = b.lastTime ? new Date(b.lastTime).getTime() : 0;
    return tB - tA;
  });

  el.innerHTML = items.map(item => {
    const isActive = item.kind === 'group'
      ? (selectedKind === 'group' && selectedGroupId == item.id)
      : (selectedKind === 'direct' && selectedId == item.id);
    const hasUnread = item.unread > 0;
    const initial = (item.name || '?').charAt(0).toUpperCase();
    const preview = item.lastMsg && item.lastMsg.message ? escapeHtml(item.lastMsg.message) : '<span style="opacity:0.6;">No messages yet</span>';
    const senderLabel = item.lastSender ? `<strong>${escapeHtml(item.lastSender)}:</strong> ` : '';
    const onClick = item.kind === 'group' ? `selectGroup(${item.id})` : `selectConversation(${item.id})`;
    const avatar = item.kind === 'group'
      ? `<div class="msg-conv-avatar msg-conv-avatar-group"><i class="bi bi-people"></i></div>`
      : `<div class="msg-conv-avatar">${initial}</div>`;
    const sub = item.kind === 'group' && item.memberCount ? ` · ${item.memberCount} members` : '';
    const pinIcon = item.pinned ? '<i class="bi bi-pin-angle-fill msg-conv-pinned-icon"></i>' : '';
    return `
      <div class="msg-conv-item ${isActive ? 'active' : ''} ${item.pinned ? 'pinned' : ''}" onclick="${onClick}">
        ${avatar}
        <div class="msg-conv-body">
          <div class="msg-conv-name">
            ${escapeHtml(item.name)}<span style="font-weight:400;color:var(--text-muted,#888);font-size:0.68rem;">${sub}</span>
            ${pinIcon}
            ${hasUnread ? '<span class="badge bg-danger" style="font-size:0.55rem;padding:2px 5px;">NEW</span>' : ''}
          </div>
          <div class="msg-conv-preview">${senderLabel}${preview}</div>
        </div>
        <div class="msg-conv-meta">
          <div class="msg-conv-time">${item.lastTime ? timeAgo(item.lastTime) : ''}</div>
          ${hasUnread ? `<div class="msg-conv-unread">${item.unread}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

// ── Filter ─────────────────────────────────────────────────────────────
function filterConversations() {
  const q = document.getElementById('msgSearch').value.toLowerCase().trim();
  document.querySelectorAll('.msg-conv-item').forEach(item => {
    const name = item.querySelector('.msg-conv-name')?.textContent?.toLowerCase() || '';
    const preview = item.querySelector('.msg-conv-preview')?.textContent?.toLowerCase() || '';
    item.style.display = (!q || name.includes(q) || preview.includes(q)) ? '' : 'none';
  });
}

// ── Select conversation (direct) ───────────────────────────────────────
function selectConversation(id) {
  selectedKind = 'direct';
  selectedId = id;
  selectedGroupId = null;
  renderConversationList();
  renderChat();

  // Mark unread from other person as read
  const conv = conversations[id];
  if (conv) {
    conv.messages.forEach(m => {
      const isMine = Number(m.sender_id) === MY_ID;
      if (!m.is_read && !isMine) {
        apiRequest(`/notifications/${m.id}/read/`, { method: 'PATCH' });
        m.is_read = true;
      }
    });
    conv.unread = 0;
    renderConversationList();
  }

  if (window.innerWidth <= 900) {
    document.getElementById('msgPage').classList.add('hide-list');
    document.getElementById('msgPage').classList.remove('hide-chat');
  }
  loadTopbarNotifications();
  loadSidebarMessageBadge();
}

// ── Select a group chat ────────────────────────────────────────────────
function selectGroup(id) {
  selectedKind = 'group';
  selectedGroupId = id;
  selectedId = null;
  renderConversationList();
  renderGroupChat();
  loadGroupMessages(id);

  // Mark the group as read for this user
  apiRequest(`/workouts/message-groups/${id}/read/`, { method: 'POST' }).then(async res => {
    if (res && res.ok) {
      const g = groups.find(x => x.id == id);
      if (g) g.unread_count = 0;
      renderConversationList();
    }
  });

  if (window.innerWidth <= 900) {
    document.getElementById('msgPage').classList.add('hide-list');
    document.getElementById('msgPage').classList.remove('hide-chat');
  }
  loadTopbarNotifications();
  loadSidebarMessageBadge();
}

async function loadGroupMessages(id) {
  const res = await apiRequest(`/workouts/message-groups/${id}/`);
  if (res && res.ok) {
    groupMessagesCache[id] = await res.json();
    if (selectedKind === 'group' && selectedGroupId == id) renderGroupChat();
  }
}

// ── Message bubbles (edit / delete / edited tag) ───────────────────────
function updateChatPinButton() {
  const btn = document.getElementById('chatPinBtn');
  if (!btn) return;
  const pinned = selectedKind === 'group'
    ? isPinned('group', selectedGroupId)
    : isPinned('direct', selectedId);
  if (pinned) {
    btn.classList.add('pinned');
    btn.title = 'Unpin conversation';
    btn.innerHTML = '<i class="bi bi-pin-angle-fill"></i>';
  } else {
    btn.classList.remove('pinned');
    btn.title = 'Pin conversation';
    btn.innerHTML = '<i class="bi bi-pin"></i>';
  }
}

function bubbleHtml(m, senderName, isMine) {
  const editing = editingMessageId === m.id;
  const time = new Date(m.created_at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  const editedTag = (m.is_edited && !editing)
    ? '<span class="msg-edited-tag">edited</span>'
    : '';
  let content;
  let cls = 'msg-bubble' + (isMine ? ' sent' : ' received');
  if (editing) {
    cls += ' editing';
    content = `
      <textarea id="editMsgInput" class="msg-edit-input" rows="1" onkeydown="handleEditKeydown(event)">${escapeHtml(m.message)}</textarea>
      <div class="msg-edit-actions">
        <button class="btn btn-sm btn-danger" onclick="saveEdit()"><i class="bi bi-check2 me-1"></i>Save</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="cancelEdit()">Cancel</button>
      </div>`;
  } else {
    const actions = isMine ? `
      <div class="msg-bubble-actions">
        <button class="msg-bubble-action" onclick="startEditMessage(${m.id})" title="Edit"><i class="bi bi-pencil"></i></button>
        <button class="msg-bubble-action" onclick="deleteMessage(${m.id})" title="Delete"><i class="bi bi-trash"></i></button>
      </div>` : '';
    content = `
      <div class="msg-bubble-text">${escapeHtml(m.message)}</div>${actions}`;
  }
  return `
    <div class="${cls}" data-msg-id="${m.id}">
      <div class="msg-bubble-sender">${escapeHtml(senderName)}</div>
      ${content}
      <div class="msg-bubble-time">${time} ${editedTag}</div>
    </div>`;
}

function renderMessageList(messages, convName) {
  const body = document.getElementById('chatBody');
  if (!messages.length) {
    body.innerHTML = '<div class="msg-chat-empty"><i class="bi bi-chat-dots"></i><div>No messages yet</div></div>';
    return;
  }
  let lastDate = '';
  body.innerHTML = messages.map(m => {
    const isMine = Number(m.sender_id) === MY_ID;
    const senderName = isMine ? 'You' : (convName(m) || 'Member');
    const msgDate = new Date(m.created_at).toDateString();
    let divider = '';
    if (msgDate !== lastDate) {
      lastDate = msgDate;
      divider = `<div class="msg-date-divider">${formatDateDivider(m.created_at)}</div>`;
    }
    return divider + bubbleHtml(m, senderName, isMine);
  }).join('');
  body.scrollTop = body.scrollHeight;
}

// ── Render chat (direct) ───────────────────────────────────────────────
function renderChat() {
  if (selectedKind !== 'direct') return;
  const conv = conversations[selectedId];
  if (!conv) return;

  document.getElementById('noChatPlaceholder').style.display = 'none';
  const chatView = document.getElementById('chatView');
  chatView.style.display = 'flex';

  const initial = (conv.name || '?').charAt(0).toUpperCase();
  document.getElementById('chatAvatar').textContent = initial;
  document.getElementById('chatName').textContent = conv.name;
  document.getElementById('chatSub').textContent = `${conv.messages.length} message${conv.messages.length !== 1 ? 's' : ''}`;
  updateChatPinButton();
  document.getElementById('chatPinBtn').style.display = '';
  document.getElementById('chatDeleteBtn').style.display = '';

  renderMessageList(conv.messages, () => conv.name);
  document.getElementById('sendBtn').disabled = !document.getElementById('replyInput').value.trim();
}

// ── Render chat (group) ────────────────────────────────────────────────
function renderGroupChat() {
  if (selectedKind !== 'group') return;
  const group = groups.find(g => g.id == selectedGroupId);
  if (!group) return;

  document.getElementById('noChatPlaceholder').style.display = 'none';
  const chatView = document.getElementById('chatView');
  chatView.style.display = 'flex';

  document.getElementById('chatAvatar').textContent = '👥';
  document.getElementById('chatName').textContent = group.name;
  const memberCount = (group.member_ids || []).length;
  document.getElementById('chatSub').textContent = `${memberCount} member${memberCount !== 1 ? 's' : ''}`;
  updateChatPinButton();
  document.getElementById('chatPinBtn').style.display = '';
  document.getElementById('chatDeleteBtn').style.display = '';

  const msgs = groupMessagesCache[group.id] || [];
  renderMessageList(msgs, m => m.sender_name || 'Member');
  document.getElementById('sendBtn').disabled = !document.getElementById('replyInput').value.trim();
}

// ── Pin / unpin ────────────────────────────────────────────────────────
async function togglePin() {
  let kind, id;
  if (selectedKind === 'group') { kind = 'group'; id = selectedGroupId; }
  else if (selectedKind === 'direct') { kind = 'direct'; id = selectedId; }
  else return;
  if (id == null) return;

  if (isPinned(kind, id)) {
    await apiRequest(`/workouts/message-pins/?kind=${kind}&target_id=${id}`, { method: 'DELETE' });
    delete pins[pinKey(kind, id)];
  } else {
    const res = await apiRequest('/workouts/message-pins/', {
      method: 'POST',
      body: JSON.stringify({ kind, target_id: Number(id) }),
    });
    if (!res || !res.ok) {
      showToast('Could not pin this conversation', 'error');
      return;
    }
    pins[pinKey(kind, id)] = true;
  }
  updateChatPinButton();
  renderConversationList();
}

// ── Delete conversation ──────────────────────────────────────────────
async function deleteConversation() {
  let kind, id, name;
  if (selectedKind === 'group') {
    kind = 'group';
    id = selectedGroupId;
    const group = groups.find(g => g.id == id);
    name = group ? group.name : 'this group';
  } else if (selectedKind === 'direct') {
    kind = 'direct';
    id = selectedId;
    const conv = conversations[id];
    name = conv ? conv.name : 'this conversation';
  } else {
    return;
  }
  if (id == null) return;

  const ok = await confirmAction(
    `This will permanently delete the entire conversation with "${name}" for you. This cannot be undone.`,
    {
      title: 'Delete conversation?',
      confirmText: 'Delete',
    }
  );
  if (!ok) return;

  const res = await apiRequest(`/workouts/conversations/delete/?kind=${kind}&target_id=${id}`, {
    method: 'DELETE',
  });
  if (!res) {
    showToast('Could not delete conversation', 'error');
    return;
  }
  if (!res.ok) {
    const err = await res.json();
    showToast(err.detail || 'Could not delete conversation', 'error');
    return;
  }

  showToast('Conversation deleted', 'success');

  // Remove from local state
  if (kind === 'group') {
    groups = groups.filter(g => g.id != id);
    delete groupMessagesCache[id];
  } else {
    allMessages = allMessages.filter(m => {
      const isMine = Number(m.sender_id) === MY_ID;
      const otherId = isMine ? m.recipient_id : m.sender_id;
      return otherId != id;
    });
    groupConversations();
  }
  delete pins[pinKey(kind, id)];
  resetChat();
}

// ── Edit message (own messages only) ───────────────────────────────────
function startEditMessage(id) {
  editingMessageId = id;
  if (selectedKind === 'group') renderGroupChat(); else renderChat();
  const input = document.getElementById('editMsgInput');
  if (input) {
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
  }
}

function cancelEdit() {
  editingMessageId = null;
  if (selectedKind === 'group') renderGroupChat(); else renderChat();
}

function handleEditKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(); }
  else if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
}

async function saveEdit() {
  const input = document.getElementById('editMsgInput');
  if (!input) return;
  const newText = input.value.trim();
  if (!newText) { showToast('Message cannot be empty', 'error'); return; }
  const id = editingMessageId;
  let res;
  if (selectedKind === 'group') {
    res = await apiRequest(`/workouts/message-groups/${selectedGroupId}/messages/${id}/`, {
      method: 'PATCH',
      body: JSON.stringify({ message: newText }),
    });
  } else {
    res = await apiRequest(`/workouts/messages/direct/${id}/`, {
      method: 'PATCH',
      body: JSON.stringify({ message: newText }),
    });
  }
  if (res && res.ok) {
    if (selectedKind === 'group') {
      const m = (groupMessagesCache[selectedGroupId] || []).find(x => x.id === id);
      if (m) { m.message = newText; m.is_edited = true; }
      const g = groups.find(x => x.id == selectedGroupId);
      if (g && g.last_sender_id === MY_ID) {
        g.last_message = newText;
        g.last_created_at = new Date().toISOString();
      }
      renderConversationList();
    } else {
      const m = allMessages.find(x => x.id === id);
      if (m) { m.message = newText; m.is_edited = true; }
      groupConversations();
      renderConversationList();
    }
    editingMessageId = null;
    if (selectedKind === 'group') renderGroupChat(); else renderChat();
  } else if (res) {
    const err = await res.json();
    showToast(err.detail || 'Could not update message', 'error');
  } else {
    showToast('Could not update message', 'error');
  }
}

// ── Delete message (own messages only) ─────────────────────────────────
async function deleteMessage(id) {
  const ok = await confirmAction('This removes the message for everyone in this chat.', {
    title: 'Delete message?',
    confirmText: 'Delete',
  });
  if (!ok) return;
  let res;
  if (selectedKind === 'group') {
    res = await apiRequest(`/workouts/message-groups/${selectedGroupId}/messages/${id}/`, { method: 'DELETE' });
  } else {
    res = await apiRequest(`/workouts/messages/direct/${id}/`, { method: 'DELETE' });
  }
  if (!res) { showToast('Could not delete message', 'error'); return; }
  if (!res.ok) {
    const err = await res.json();
    showToast(err.detail || 'Could not delete message', 'error');
    return;
  }
  if (selectedKind === 'group') {
    groupMessagesCache[selectedGroupId] = (groupMessagesCache[selectedGroupId] || []).filter(m => m.id !== id);
    renderGroupChat();
  } else {
    allMessages = allMessages.filter(m => m.id !== id);
    groupConversations();
    renderConversationList();
    if (selectedId != null && conversations[selectedId]) {
      renderChat();
    } else {
      resetChat();
    }
  }
}

function resetChat() {
  editingMessageId = null;
  selectedKind = null;
  selectedId = null;
  selectedGroupId = null;
  document.getElementById('chatView').style.display = 'none';
  document.getElementById('noChatPlaceholder').style.display = '';
  document.getElementById('chatPinBtn').style.display = 'none';
  document.getElementById('chatDeleteBtn').style.display = 'none';
  renderConversationList();
}

// ── Send reply (direct or group) ───────────────────────────────────────
async function sendReply() {
  const input = document.getElementById('replyInput');
  const msg = input.value.trim();
  if (!msg) return;

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  input.value = '';

  let res;
  if (selectedKind === 'group') {
    if (!selectedGroupId) { btn.disabled = false; return; }
    res = await apiRequest(`/workouts/message-groups/${selectedGroupId}/messages/`, {
      method: 'POST',
      body: JSON.stringify({ message: msg }),
    });
  } else {
    if (!selectedId) { btn.disabled = false; return; }
    res = await apiRequest('/workouts/messages/direct/', {
      method: 'POST',
      body: JSON.stringify({ message: msg, recipient_id: parseInt(selectedId) }),
    });
  }

  if (res && res.ok) {
    let savedId = null;
    try { savedId = (await res.json()).id || null; } catch (e) { /* 204 or empty body */ }
    if (selectedKind === 'group') {
      const sent = {
        id: savedId || Date.now(),
        message: msg,
        is_read: true,
        created_at: new Date().toISOString(),
        sender_id: MY_ID,
        sender_name: localStorage.getItem('user_name') || 'You',
      };
      if (!groupMessagesCache[selectedGroupId]) groupMessagesCache[selectedGroupId] = [];
      groupMessagesCache[selectedGroupId].push(sent);
      // Update the group preview
      const g = groups.find(x => x.id == selectedGroupId);
      if (g) {
        g.last_message = msg;
        g.last_sender_name = 'You';
        g.last_created_at = new Date().toISOString();
        g.unread_count = 0;
      }
      renderConversationList();
      renderGroupChat();
    } else {
      const conv = conversations[selectedId];
      const sent = {
        id: savedId || Date.now(),
        message: msg,
        is_read: true,
        created_at: new Date().toISOString(),
        sender_name: localStorage.getItem('user_name') || 'You',
        notification_type: IS_MEMBER ? 'MEMBER_MESSAGE' : 'TRAINER_REPLY',
        related_membership_id: MY_ID,
        sender_id: MY_ID,
        recipient_id: parseInt(selectedId),
        recipient_name: conv ? conv.name : '',
        title: IS_MEMBER ? 'Message from You' : 'Reply from You',
      };
      allMessages.push(sent);
      groupConversations();
      renderConversationList();
      renderChat();
    }
  } else {
    if (res) {
      const err = await res.json();
      showToast(err.detail || 'Could not send message', 'error');
    } else {
      showToast('Could not send message', 'error');
    }
    input.value = msg;
    btn.disabled = false;
  }
}

function handleReplyKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendReply();
  }
  document.getElementById('sendBtn').disabled = !e.target.value.trim();
}

document.getElementById('replyInput')?.addEventListener('input', function() {
  document.getElementById('sendBtn').disabled = !this.value.trim();
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ── New Message Modal (recipient list is role-filtered by the API) ────
async function openNewMessageModal() {
  document.getElementById('newMsgText').value = '';
  const select = document.getElementById('newMsgRecipient');
  select.innerHTML = '<option value="">Loading...</option>';
  new bootstrap.Modal(document.getElementById('newMsgModal')).show();

  const res = await apiRequest('/workouts/message-recipients/');
  if (res && res.ok) {
    const users = await res.json();
    select.innerHTML = users.length
      ? '<option value="">Select a recipient...</option>' + users.map(u =>
          `<option value="${u.user_id}">${escapeHtml(u.full_name)} (${escapeHtml(u.role.toLowerCase())})</option>`).join('')
      : '<option value="">No one available to message</option>';
  } else {
    select.innerHTML = '<option value="">Could not load recipients</option>';
  }
}

async function sendNewMessage() {
  const msg = document.getElementById('newMsgText').value.trim();
  if (!msg) { showToast('Please type a message', 'error'); return; }
  const recipientId = document.getElementById('newMsgRecipient').value;
  if (!recipientId) { showToast('Please select a recipient', 'error'); return; }

  const res = await apiRequest('/workouts/messages/direct/', {
    method: 'POST',
    body: JSON.stringify({ message: msg, recipient_id: parseInt(recipientId) }),
  });

  if (res && res.ok) {
    bootstrap.Modal.getInstance(document.getElementById('newMsgModal'))?.hide();
    showToast('Message sent!', 'success');
    await loadMessages();
  } else if (res) {
    const err = await res.json();
    showToast(err.detail || 'Could not send message', 'error');
  } else {
    showToast('Could not send message', 'error');
  }
}

// ── New Group Modal (trainers / staff / owner only) ────────────────────
async function openNewGroupModal() {
  document.getElementById('newGroupName').value = '';
  const list = document.getElementById('newGroupMembers');
  list.innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm text-danger"></div></div>';
  new bootstrap.Modal(document.getElementById('newGroupModal')).show();

  const res = await apiRequest('/workouts/message-recipients/?purpose=group');
  if (res && res.ok) {
    const users = await res.json();
    list.innerHTML = users.length
      ? users.map(u => `
          <div class="form-check mb-1">
            <input class="form-check-input group-member-cb" type="checkbox" value="${u.user_id}" id="gm${u.user_id}">
            <label class="form-check-label" for="gm${u.user_id}" style="font-size:0.85rem;">${escapeHtml(u.full_name)} <span class="text-muted">(${escapeHtml(u.role.toLowerCase())})</span></label>
          </div>`).join('')
      : '<div class="text-muted small text-center py-2">No one available to add</div>';
  } else {
    list.innerHTML = '<div class="text-muted small text-center py-2">Could not load members</div>';
  }
}

async function createGroup() {
  const name = document.getElementById('newGroupName').value.trim();
  const memberIds = [...document.querySelectorAll('.group-member-cb:checked')].map(cb => parseInt(cb.value));
  if (!name) { showToast('Please enter a group name', 'error'); return; }
  if (!memberIds.length) { showToast('Select at least one member', 'error'); return; }

  const res = await apiRequest('/workouts/message-groups/', {
    method: 'POST',
    body: JSON.stringify({ name, member_ids: memberIds }),
  });

  if (res && res.ok) {
    const data = await res.json();
    bootstrap.Modal.getInstance(document.getElementById('newGroupModal'))?.hide();
    showToast('Group created!', 'success');
    await loadMessages();
    selectGroup(data.id);
  } else if (res) {
    const err = await res.json();
    showToast(err.detail || 'Could not create group', 'error');
  } else {
    showToast('Could not create group', 'error');
  }
}

function showListPanel() {
  document.getElementById('msgPage').classList.remove('hide-list');
  document.getElementById('msgPage').classList.add('hide-chat');
}

// ── Inject "New" / "New Group" buttons ─────────────────────────────
(function injectNewButtons() {
  const header = document.querySelector('.msg-list-header .d-flex');
  if (!header) return;
  if (!header.querySelector('.btn-new-msg')) {
    const btn = document.createElement('button');
    btn.className = 'btn-new-msg';
    btn.onclick = openNewMessageModal;
    btn.innerHTML = '<i class="bi bi-plus-lg"></i> New';
    header.appendChild(btn);
  }
  if (CAN_CREATE_GROUP && !header.querySelector('.btn-new-group')) {
    const btn = document.createElement('button');
    btn.className = 'btn-new-msg btn-new-group';
    btn.onclick = openNewGroupModal;
    btn.innerHTML = '<i class="bi bi-people"></i> New Group';
    header.appendChild(btn);
  }
})();

// ── Init ───────────────────────────────────────────────────────────────
loadMessages();
loadTopbarNotifications();
</script>
