<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — FitCore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/login.css" rel="stylesheet">
</head>
<body>

<div class="login-bg"></div>

<div class="login-container">

  <!-- Left side - Branding -->
  <div class="login-left">
    <a href="http://localhost:5500/" class="login-back-link">
      <i class="bi bi-arrow-left"></i> Back to Home
    </a>

    <div class="login-branding">
      <div class="login-logo">
        <img src="logo.png" alt="FitCore">
      </div>
      <h1 class="login-brand-name">FitCore</h1>
      <p class="login-brand-tagline">Join FitCore and start your fitness journey today.</p>
    </div>

    <div class="login-features">
      <div class="login-feature-item">
        <i class="bi bi-check-circle-fill"></i>
        <span>Track your progress & workouts</span>
      </div>
      <div class="login-feature-item">
        <i class="bi bi-check-circle-fill"></i>
        <span>Get personalized diet plans</span>
      </div>
      <div class="login-feature-item">
        <i class="bi bi-check-circle-fill"></i>
        <span>Manage memberships & payments</span>
      </div>
    </div>
  </div>

  <!-- Right side - Sign Up form -->
  <div class="login-right">
    <div class="login-card">
      <div class="login-card-header">
        <h2>Create Account</h2>
        <p>Sign up for a free FitCore account</p>
      </div>

      <div id="errorBox" class="login-alert login-alert-danger d-none"></div>
      <div id="successBox" class="login-alert d-none" style="background-color:rgba(16,185,129,0.1);color:#059669;border-left:3px solid #10b981;"></div>

      <form id="signupForm" class="login-form" autocomplete="on">
        <div class="row g-3">
          <div class="col-6">
            <div class="login-form-group">
              <label class="login-label">First Name</label>
              <div class="login-input-wrapper">
                <i class="bi bi-person-fill"></i>
                <input type="text" class="login-input" id="firstName" name="first_name" placeholder="First name" required autocomplete="given-name">
              </div>
            </div>
          </div>
          <div class="col-6">
            <div class="login-form-group">
              <label class="login-label">Last Name</label>
              <div class="login-input-wrapper">
                <i class="bi bi-person-fill"></i>
                <input type="text" class="login-input" id="lastName" name="last_name" placeholder="Last name" required autocomplete="family-name">
              </div>
            </div>
          </div>
        </div>

        <div class="login-form-group">
          <label class="login-label">Email Address</label>
          <div class="login-input-wrapper">
            <i class="bi bi-envelope-fill"></i>
            <input type="email" class="login-input" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
          </div>
        </div>

        <div class="login-form-group">
          <label class="login-label">Phone Number</label>
          <div class="login-input-wrapper">
            <i class="bi bi-telephone-fill"></i>
            <input type="tel" class="login-input" id="phone" name="phone" placeholder="e.g. 9841234567" autocomplete="tel">
          </div>
        </div>

        <div class="login-form-group">
          <label class="login-label">Password</label>
          <div class="login-input-wrapper">
            <i class="bi bi-lock-fill"></i>
            <input type="password" class="login-input" id="password" name="password" placeholder="Create a password" required minlength="8" autocomplete="new-password">
            <button type="button" class="login-toggle-password toggle-password" data-target="password" tabindex="-1">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="login-form-group">
          <label class="login-label">Confirm Password</label>
          <div class="login-input-wrapper">
            <i class="bi bi-lock-fill"></i>
            <input type="password" class="login-input" id="password2" name="password2" placeholder="Confirm your password" required minlength="8" autocomplete="new-password">
            <button type="button" class="login-toggle-password toggle-password" data-target="password2" tabindex="-1">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn-primary">
          <span>Create Account</span>
          <i class="bi bi-arrow-right-short"></i>
        </button>
      </form>

      <div class="login-divider">
        <span>or continue with</span>
      </div>

      <div class="login-social-buttons">
        <button type="button" class="login-social-btn login-social-google" onclick="socialSignup('google')">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button type="button" class="login-social-btn login-social-facebook" onclick="socialSignup('facebook')">
          <i class="bi bi-facebook"></i>
          Facebook
        </button>
      </div>

      <div class="login-register-prompt">
        Already have an account? <a href="login.html" class="login-register-link">Sign in</a>
      </div>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/validate.js"></script>
<script>
  // Clear fields on load
  window.addEventListener('load', () => {
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
    document.getElementById('password2').value = '';
  });

  const signupRules = {
    firstName: [
      v => validate.required(v, 'First name'),
      v => validate.maxLength(v, 50, 'First name'),
    ],
    lastName: [
      v => validate.required(v, 'Last name'),
      v => validate.maxLength(v, 50, 'Last name'),
    ],
    email: [
      v => validate.required(v, 'Email'),
      v => validate.email(v),
    ],
    phone: [
      v => validate.phone(v),
    ],
    password: [
      v => validate.required(v, 'Password'),
      v => validate.password(v),
    ],
    password2: [
      v => validate.required(v, 'Confirm password'),
      v => {
        const pw = document.getElementById('password').value;
        return validate.passwordMatch(pw, v);
      },
    ],
  };

  initFormValidation(document.getElementById('signupForm'), signupRules, async (form) => {
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    errorBox.classList.add('d-none');
    successBox.classList.add('d-none');

    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const password2 = document.getElementById('password2').value;

    if (password !== password2) {
      errorBox.textContent = 'Passwords do not match.';
      errorBox.classList.remove('d-none');
      return;
    }

    const body = { first_name: firstName, last_name: lastName, email, password, password2 };
    if (phone) body.phone = phone;

    try {
      const res = await fetch(`${API_BASE}/auth/register/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();

      if (res.ok) {
        saveTokens(data.tokens.access, data.tokens.refresh);
        localStorage.setItem('user_id', data.user.id);
        localStorage.setItem('user_role', data.user.role);
        localStorage.setItem('user_name', data.user.full_name);
        localStorage.setItem('user_picture', data.user.profile_picture || '');
        window.location.href = 'getting-started.html';
      } else {
        const msg = typeof data === 'object'
          ? Object.entries(data).map(([k, v]) => {
              const msgs = Array.isArray(v) ? v : [v];
              return msgs.map(m => k === 'non_field_errors' ? m : `${k}: ${m}`).join('\n');
            }).join('\n')
          : 'Registration failed.';
        errorBox.textContent = msg;
        errorBox.classList.remove('d-none');
      }
    } catch (err) {
      errorBox.textContent = 'Network error. Please try again.';
      errorBox.classList.remove('d-none');
    }
  });

  function socialSignup(provider) {
    window.location.href = `${API_BASE}/auth/${provider}/login/`;
  }
</script>
</body>
</html>
