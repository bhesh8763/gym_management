<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Equipment — Gym Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/theme.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark px-3">
      <span class="navbar-brand">Gym Management</span>
      <div class="d-flex align-items-center text-white">
        <span id="userLabel" class="me-3"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">
          Logout
        </button>
      </div>
    </nav>

    <div class="d-flex">
      <div class="sidebar">
        <div class="list-group list-group-flush pt-2">
          <a href="dashboard.html" class="list-group-item"
            ><i class="bi bi-arrow-left"></i> Dashboard</a
          >
          <a href="members.html" class="list-group-item list-group-item-action"
            ><i class="bi bi-person-lines-fill"></i> Members</a
          >
          <a href="memberships.html" class="list-group-item list-group-item-action"
            ><i class="bi bi-card-checklist"></i> Memberships</a
          >
          <a
            href="attendance.html"
            class="list-group-item list-group-item-action"
            ><i class="bi bi-calendar-check"></i> Attendance</a
          >
          <a href="payments.html" class="list-group-item list-group-item-action"
            ><i class="bi bi-cash-coin"></i> Payments</a
          >
          <a href="staff.html" class="list-group-item list-group-item-action"
            ><i class="bi bi-people"></i> Staff</a
          >
          <a href="lockers.html" class="list-group-item list-group-item-action"
            ><i class="bi bi-lock"></i> Lockers</a
          >
          <a
            href="equipment.html"
            class="list-group-item list-group-item-action active"
            ><i class="bi bi-tools"></i> Equipment</a
          >
        </div>
      </div>

      <div class="p-4 flex-grow-1">
        <h3>Equipment Inventory</h3>

        <h5>Add Equipment</h5>
        <form id="equipForm" class="row g-2 mb-4 align-items-end">
          <div class="col-auto">
            <label class="form-label">Name</label>
            <input type="text" id="name" class="form-control" required />
          </div>
          <div class="col-auto">
            <label class="form-label">Category</label>
            <input type="text" id="category" class="form-control" required />
          </div>
          <div class="col-auto">
            <label class="form-label">Brand</label>
            <input type="text" id="brand" class="form-control" />
          </div>
          <div class="col-auto">
            <label class="form-label">Quantity</label>
            <input
              type="number"
              min="1"
              id="quantity"
              class="form-control"
              value="1"
              required
            />
          </div>
          <div class="col-auto">
            <label class="form-label">Purchase Date</label>
            <input type="date" id="purchaseDate" class="form-control" />
          </div>
          <div class="col-auto">
            <label class="form-label">Purchase Price</label>
            <input
              type="number"
              step="0.01"
              min="0"
              id="purchasePrice"
              class="form-control"
            />
          </div>
          <div class="col-auto">
            <label class="form-label">Location</label>
            <input type="text" id="location" class="form-control" />
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-primary">Add Equipment</button>
          </div>
        </form>
        <div id="equipError" class="alert alert-danger d-none"></div>

        <table class="table table-bordered mb-5">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Category</th>
              <th>Brand</th>
              <th>Qty</th>
              <th>Condition</th>
              <th>Location</th>
            </tr>
          </thead>
          <tbody id="equipTableBody"></tbody>
        </table>

        <hr />

        <h3>Maintenance Records</h3>

        <h5>Log Maintenance</h5>
        <form id="maintForm" class="row g-2 mb-4 align-items-end">
          <div class="col-auto">
            <label class="form-label">Equipment ID</label>
            <input
              type="number"
              min="1"
              id="maintEquipId"
              class="form-control"
              required
            />
          </div>
          <div class="col-auto">
            <label class="form-label">Type</label>
            <select id="maintType" class="form-select">
              <option value="ROUTINE">Routine Check</option>
              <option value="REPAIR">Repair</option>
              <option value="REPLACEMENT">Part Replacement</option>
              <option value="INSPECTION">Inspection</option>
            </select>
          </div>
          <div class="col-auto">
            <label class="form-label">Scheduled Date</label>
            <input
              type="date"
              id="scheduledDate"
              class="form-control"
              required
            />
          </div>
          <div class="col-auto">
            <label class="form-label">Cost</label>
            <input
              type="number"
              step="0.01"
              min="0"
              id="cost"
              class="form-control"
              value="0"
            />
          </div>
          <div class="col-auto">
            <label class="form-label">Description</label>
            <input type="text" id="description" class="form-control" required />
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-primary">
              Log Maintenance
            </button>
          </div>
        </form>
        <div id="maintError" class="alert alert-danger d-none"></div>

        <table class="table table-bordered">
          <thead>
            <tr>
              <th>ID</th>
              <th>Equipment</th>
              <th>Type</th>
              <th>Status</th>
              <th>Scheduled</th>
              <th>Cost</th>
              <th>Recorded By</th>
            </tr>
          </thead>
          <tbody id="maintTableBody"></tbody>
        </table>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      if (!getAccessToken()) window.location.href = "index.html";
      document.getElementById("userLabel").textContent =
        `${localStorage.getItem("user_name")} (${localStorage.getItem("user_role")})`;

      function logout() {
        clearTokens();
        window.location.href = "index.html";
      }

      async function loadEquipment() {
        const res = await apiRequest("/equipment/equipment/");
        if (!res) return;
        const data = await res.json();
        const tbody = document.getElementById("equipTableBody");
        tbody.innerHTML = "";
        data.results.forEach((row) => {
          tbody.innerHTML += `
          <tr>
            <td>${row.id}</td><td>${row.name}</td><td>${row.category}</td>
            <td>${row.brand || "-"}</td><td>${row.quantity}</td>
            <td>${row.condition}</td><td>${row.location || "-"}</td>
          </tr>`;
        });
      }

      document
        .getElementById("equipForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const errorBox = document.getElementById("equipError");
          errorBox.classList.add("d-none");
          const payload = {
            name: document.getElementById("name").value,
            category: document.getElementById("category").value,
            brand: document.getElementById("brand").value,
            quantity: document.getElementById("quantity").value,
            purchase_date:
              document.getElementById("purchaseDate").value || null,
            purchase_price:
              document.getElementById("purchasePrice").value || null,
            location: document.getElementById("location").value,
          };
          const res = await apiRequest("/equipment/equipment/", {
            method: "POST",
            body: JSON.stringify(payload),
          });
          if (!res) return;
          if (res.ok) {
            document.getElementById("equipForm").reset();
            loadEquipment();
          } else {
            const err = await res.json();
            errorBox.textContent = JSON.stringify(err);
            errorBox.classList.remove("d-none");
          }
        });

      async function loadMaintenance() {
        const res = await apiRequest("/equipment/maintenance/");
        if (!res) return;
        const data = await res.json();
        const tbody = document.getElementById("maintTableBody");
        tbody.innerHTML = "";
        data.results.forEach((row) => {
          tbody.innerHTML += `
          <tr>
            <td>${row.id}</td><td>${row.equipment_name}</td><td>${row.maintenance_type}</td>
            <td>${row.status}</td><td>${row.scheduled_date}</td><td>${row.cost}</td>
            <td>${row.recorded_by_name || "-"}</td>
          </tr>`;
        });
      }

      document
        .getElementById("maintForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const errorBox = document.getElementById("maintError");
          errorBox.classList.add("d-none");
          const payload = {
            equipment: parseInt(document.getElementById("maintEquipId").value),
            maintenance_type: document.getElementById("maintType").value,
            scheduled_date: document.getElementById("scheduledDate").value,
            cost: document.getElementById("cost").value,
            description: document.getElementById("description").value,
          };
          const res = await apiRequest("/equipment/maintenance/", {
            method: "POST",
            body: JSON.stringify(payload),
          });
          if (!res) return;
          if (res.ok) {
            document.getElementById("maintForm").reset();
            loadMaintenance();
          } else {
            const err = await res.json();
            errorBox.textContent = JSON.stringify(err);
            errorBox.classList.remove("d-none");
          }
        });

      loadEquipment();
      loadMaintenance();
    </script>
  </body>
</html>
