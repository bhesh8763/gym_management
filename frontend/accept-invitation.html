<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitCore — Accept invitation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/login.css" rel="stylesheet">
</head>
<body>
<div class="login-bg"></div>
<main class="login-container">
  <section class="login-right w-100">
    <div class="login-form-wrap mx-auto">
      <a href="index.html" class="login-back-link"><i class="bi bi-arrow-left"></i> Back to Home</a>
      <h2 class="fw-bold mb-2">Accept your invitation</h2>
      <p class="text-muted mb-4">Join the gym and set up your account.</p>
      <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
      <form id="invitationForm">
        <div class="mb-3">
          <label class="form-label" for="firstName">First name</label>
          <input id="firstName" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="lastName">Last name</label>
          <input id="lastName" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">New password</label>
          <input id="password" class="form-control" type="password" minlength="8" required>
          <small class="form-text text-muted">Use this field for a new account.</small>
        </div>
        <div class="mb-3">
          <label class="form-label" for="currentPassword">Current account password</label>
          <input id="currentPassword" class="form-control" type="password">
          <small class="form-text text-muted">Required only if this email already has a FitCore account.</small>
        </div>
        <button class="btn btn-primary w-100" type="submit">Accept invitation</button>
      </form>
    </div>
  </section>
</main>
<script src="js/api.js"></script>
<script>
  const token = new URLSearchParams(location.search).get('token') || '';
  const errorBox = document.getElementById('errorBox');
  if (!token) {
    errorBox.textContent = 'This invitation link is missing its token.';
    errorBox.classList.remove('d-none');
    document.getElementById('invitationForm').classList.add('d-none');
  }
  document.getElementById('invitationForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    errorBox.classList.add('d-none');
    const body = {
      token,
      first_name: document.getElementById('firstName').value.trim(),
      last_name: document.getElementById('lastName').value.trim(),
      password: document.getElementById('password').value,
      current_password: document.getElementById('currentPassword').value,
    };
    try {
      const response = await fetch(`${API_BASE}/gyms/invitations/accept/`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      });
      const data = await response.json();
      if (!response.ok) {
        const message = Object.values(data).flat().join(' ');
        throw new Error(message || 'The invitation could not be accepted.');
      }
      saveTokens(data.access, data.refresh);
      localStorage.setItem('user_id', data.user_id);
      localStorage.setItem('gym_id', data.gym_id);
      localStorage.setItem('gym_role', data.role);
      localStorage.setItem('user_role', data.role);
      window.location.href = 'dashboard.html';
    } catch (error) {
      errorBox.textContent = error.message;
      errorBox.classList.remove('d-none');
    }
  });
</script>
</body>
</html>
