<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff — Gym Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
  <nav class="navbar navbar-dark px-3">
    <span class="navbar-brand">Gym Management</span>
    <div class="d-flex align-items-center text-white">
      <span id="userLabel" class="me-3"></span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="d-flex">
    <div class="sidebar">
      <div class="list-group list-group-flush pt-2">
        <a href="dashboard.html" class="list-group-item"><i class="bi bi-arrow-left"></i> Dashboard</a>
        <a href="attendance.html" class="list-group-item list-group-item-action"><i class="bi bi-calendar-check"></i> Attendance</a>
        <a href="payments.html" class="list-group-item list-group-item-action"><i class="bi bi-cash-coin"></i> Payments</a>
        <a href="staff.html" class="list-group-item list-group-item-action active"><i class="bi bi-people"></i> Staff</a>
        <a href="lockers.html" class="list-group-item list-group-item-action"><i class="bi bi-lock"></i> Lockers</a>
        <a href="equipment.html" class="list-group-item list-group-item-action"><i class="bi bi-tools"></i> Equipment</a>
      </div>
    </div>

    <div class="p-4 flex-grow-1">
      <h3>Staff Profiles</h3>

      <h5>Add Staff Profile</h5>
      <form id="profileForm" class="row g-2 mb-4 align-items-end">
        <div class="col-auto">
  <label class="form-label">User ID</label>
  <input type="number" id="userId" class="form-control" min="1" required>
</div>
<div class="col-auto">
  <label class="form-label">Department</label>
  <select id="department" class="form-select" required>
    <option value="FRONT_DESK">Front Desk</option>
    <option value="ACCOUNTS">Accounts</option>
    <option value="MAINTENANCE">Maintenance</option>
    <option value="MANAGEMENT">Management</option>
    <option value="OTHER">Other</option>
  </select>
</div>
<div class="col-auto">
  <label class="form-label">Designation</label>
  <input type="text" id="designation" class="form-control" required>
</div>
<div class="col-auto">
  <label class="form-label">Joined Date</label>
  <input type="date" id="joinedDate" class="form-control" required>
</div>
<div class="col-auto">
  <label class="form-label">Salary</label>
  <input type="number" step="0.01" min="0" id="salary" class="form-control" required>
</div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary">Add Profile</button>
        </div>
      </form>
      <div id="profileError" class="alert alert-danger d-none"></div>

      <table class="table table-bordered mb-5">
        <thead>
          <tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Designation</th><th>Joined</th><th>Salary</th></tr>
        </thead>
        <tbody id="profileTableBody"></tbody>
      </table>

      <hr>

      <h3>Leave Requests</h3>

      <h5>Submit Leave Request</h5>
      <form id="leaveForm" class="row g-2 mb-4 align-items-end">
        <div class="col-auto">
  <label class="form-label">Type</label>
  <select id="leaveType" class="form-select">
    <option value="SICK">Sick Leave</option>
    <option value="CASUAL">Casual Leave</option>
    <option value="ANNUAL">Annual Leave</option>
    <option value="UNPAID">Unpaid Leave</option>
    <option value="OTHER">Other</option>
  </select>
</div>
        <div class="col-auto">
          <label class="form-label">Start Date</label>
          <input type="date" id="startDate" class="form-control" required>
        </div>
        <div class="col-auto">
          <label class="form-label">End Date</label>
          <input type="date" id="endDate" class="form-control" required>
        </div>
        <div class="col-auto">
          <label class="form-label">Reason</label>
          <input type="text" id="reason" class="form-control" required>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary">Submit Request</button>
        </div>
      </form>
      <div id="leaveError" class="alert alert-danger d-none"></div>

      <table class="table table-bordered">
        <thead>
          <tr><th>ID</th><th>Requester</th><th>Type</th><th>Start</th><th>End</th><th>Days</th><th>Reason</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody id="leaveTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (!getAccessToken()) window.location.href = 'index.html';
    document.getElementById('userLabel').textContent =
      `${localStorage.getItem('user_name')} (${localStorage.getItem('user_role')})`;
    const myRole = localStorage.getItem('user_role');

    function logout() {
      clearTokens();
      window.location.href = 'index.html';
    }

    function statusBadge(status) {
      const map = { APPROVED: 'success', PENDING: 'warning', REJECTED: 'danger' };
      return `<span class="badge bg-${map[status] || 'secondary'}">${status}</span>`;
    }

    async function loadProfiles() {
      const res = await apiRequest('/staff/profiles/');
      if (!res) return;
      const data = await res.json();
      const tbody = document.getElementById('profileTableBody');
      tbody.innerHTML = '';
      data.results.forEach(row => {
        tbody.innerHTML += `
          <tr>
            <td>${row.id}</td><td>${row.user_name}</td><td>${row.user_email}</td>
            <td>${row.department}</td><td>${row.designation}</td>
            <td>${row.joined_date}</td><td>${row.salary}</td>
          </tr>`;
      });
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('profileError');
      errorBox.classList.add('d-none');
      const payload = {
        user: parseInt(document.getElementById('userId').value),
        department: document.getElementById('department').value,
        designation: document.getElementById('designation').value,
        joined_date: document.getElementById('joinedDate').value,
        salary: document.getElementById('salary').value,
      };
      const res = await apiRequest('/staff/profiles/', { method: 'POST', body: JSON.stringify(payload) });
      if (!res) return;
      if (res.ok) { document.getElementById('profileForm').reset(); loadProfiles(); }
      else {
        const err = await res.json();
        errorBox.textContent = formatApiError(err);
        errorBox.classList.remove('d-none');
      }
    });

    async function loadLeaves() {
      const res = await apiRequest('/staff/leave-requests/');
      if (!res) return;
      const data = await res.json();
      const tbody = document.getElementById('leaveTableBody');
      tbody.innerHTML = '';
      data.results.forEach(row => {
        const canReview = (myRole === 'OWNER' || myRole === 'STAFF') && row.status === 'PENDING';
        const actionCell = canReview
          ? `<button class="btn btn-sm btn-success me-1" onclick="reviewLeave(${row.id}, 'APPROVED')">Approve</button>
             <button class="btn btn-sm btn-danger" onclick="reviewLeave(${row.id}, 'REJECTED')">Reject</button>`
          : '-';
        tbody.innerHTML += `
          <tr>
            <td>${row.id}</td><td>${row.requester_name}</td><td>${row.leave_type}</td>
            <td>${row.start_date}</td><td>${row.end_date}</td><td>${row.duration_days}</td>
            <td>${row.reason}</td><td>${statusBadge(row.status)}</td><td>${actionCell}</td>
          </tr>`;
      });
    }

    async function reviewLeave(id, status) {
      const res = await apiRequest(`/staff/leave-requests/${id}/review/`, {
        method: 'POST',
        body: JSON.stringify({ status }),
      });
      if (res && res.ok) loadLeaves();
      else alert('Review action failed. Check console.');
    }

    document.getElementById('leaveForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('leaveError');
      errorBox.classList.add('d-none');
      const startVal = document.getElementById('startDate').value;
      const endVal = document.getElementById('endDate').value;
      if (endVal < startVal) {
          errorBox.textContent = 'End date cannot be before start date.';
          errorBox.classList.remove('d-none');
          return;
      }

      const payload = {
        leave_type: document.getElementById('leaveType').value,
        start_date: document.getElementById('startDate').value,
        end_date: document.getElementById('endDate').value,
        reason: document.getElementById('reason').value,
      };
      const res = await apiRequest('/staff/leave-requests/', { method: 'POST', body: JSON.stringify(payload) });
      if (!res) return;
      if (res.ok) { document.getElementById('leaveForm').reset(); loadLeaves(); }
      else {
        const err = await res.json();
        errorBox.textContent = formatApiError(err);
        errorBox.classList.remove('d-none');
      }
    });

    loadProfiles();
    loadLeaves();
    document.getElementById('startDate').addEventListener('change', function() {
  document.getElementById('endDate').min = this.value;
});
  </script>
</body>
</html>
