<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainers – FitCore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body data-allowed-roles="OWNER,STAFF">

<nav class="topbar">
  <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
    <a href="dashboard.html" class="navbar-brand d-flex align-items-center text-decoration-none">
    <img src="logo.png" alt="FitCore" style="height:32px;width:32px;margin-right:8px;object-fit:contain;">
    <span style="font-size: 1.5rem; font-weight: 700;">FitCore</span>
  </a>
  <div class="topbar-search">
    <i class="bi bi-search"></i>
    <input type="text" id="globalSearch" placeholder="Search members by name, ID, or phone…" autocomplete="off">
    <div class="topbar-search-results" id="globalSearchResults"></div>
  </div>
  <div class="position-relative">
    <button class="topbar-icon-btn" onclick="toggleDropdown('notifPanel')"><i class="bi bi-bell"></i><span class="notif-badge" id="notifCount" style="display:none;">0</span></button>
    <div class="dropdown-panel" id="notifPanel">
      <div class="d-flex justify-content-between align-items-center px-3 pt-2 pb-1 border-bottom">
        <span class="fw-semibold small">Notifications</span>
        <button id="notifMarkAllBtn" class="btn btn-sm btn-link text-danger p-0 small" onclick="markAllTopbarNotificationsRead()" disabled>
          <i class="bi bi-check2-all me-1"></i>Mark all as read
        </button>
      </div>
      <div id="notifList"><div class="notif-empty">No notifications</div></div>
      <div class="border-top text-center py-2">
        <a href="notifications.html" class="small text-danger spa-link">View all</a>
      </div>
    </div>
  </div>
  <div class="position-relative">
    <button class="profile-trigger" onclick="toggleDropdown('profilePanel')">
      <span class="profile-avatar" id="profileAvatar">?</span>
      <span class="profile-meta"><div class="profile-name" id="profileName">&mdash;</div><div class="profile-role" id="profileRole">&mdash;</div></span>
      <i class="bi bi-chevron-down text-white-50"></i>
    </button>
    <div class="dropdown-panel profile-menu" id="profilePanel">
      <a href="javascript:void(0)" onclick="openEditProfileModal()"><i class="bi bi-person"></i> Profile</a>
      <hr><button class="text-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </div>
</nav>

<div id="page-content"><div class="d-flex">
  <div class="sidebar" id="sidebar"></div>

  <div class="p-4 flex-grow-1">
    <h3 class="mb-3 fw-bold">Trainers</h3>
    <p class="text-muted mb-4">Manage trainer profiles, specializations, and availability.</p>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">Trainer Profiles</h5>
      <button class="btn btn-primary" onclick="openTrainerModal()"><i class="bi bi-plus-lg me-1"></i> Add Trainer</button>
    </div>

    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr><th>Name</th><th>ID</th><th>Specializations</th><th>Experience</th><th>Assigned</th><th>Available</th><th data-no-export>Actions</th></tr>
        </thead>
        <tbody id="trainersBody">
          <tr><td colspan="7" class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm"></div> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div></div>

<!-- Trainer Modal -->
<div class="modal fade" id="trainerModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header p-3">
        <h5 class="modal-title fw-bold" id="trainerModalTitle">Add Trainer</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div id="trainerError" class="alert alert-danger d-none mb-3"></div>
        <input type="hidden" id="trainerId">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">User Account <span class="text-danger">*</span></label>
            <select id="trainerUser" class="form-select"></select>
            <div class="form-text">Select a user with TRAINER role.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Availability</label>
            <select id="trainerAvailable" class="form-select">
              <option value="true">Available</option>
              <option value="false">Not Available</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Experience (years)</label>
            <input type="number" min="0" id="trainerExperience" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Salary (NPR)</label>
            <input type="number" step="0.01" min="0" id="trainerSalary" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Joined Date</label>
            <input type="date" id="trainerJoinedDate" class="form-control">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Specializations</label>
            <input type="text" id="trainerSpecializations" class="form-control" placeholder="e.g. Strength Training, HIIT, Yoga (comma-separated)">
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Bio</label>
            <textarea id="trainerBio" class="form-control" rows="3"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer p-3">
        <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary px-4" onclick="submitTrainer()">Save Trainer</button>
      </div>
    </div>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
buildSidebar('trainers');
if (!getAccessToken()) window.location.href = 'login.html';

var allTrainers = [];
var allUsers = [];
var isOwner = localStorage.getItem('user_role') === 'OWNER';

async function loadTrainers() {
  var res = await apiRequest('/trainers/profiles/');
  if (!res || !res.ok) {
    document.getElementById('trainersBody').innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Could not load trainers.</td></tr>';
    return;
  }
  var data = await res.json();
  allTrainers = data.results || data;

  var tbody = document.getElementById('trainersBody');
  if (allTrainers.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No trainers found. Click "Add Trainer" to create one.</td></tr>';
    return;
  }

  tbody.innerHTML = allTrainers.map(function(t) {
    var specs = (t.specializations || []).join(', ') || '--';
    var actions = '';
    if (isOwner) {
      actions = '<button class="btn btn-sm btn-outline-primary me-1" onclick="editTrainer(' + t.id + ')" title="Edit"><i class="bi bi-pencil"></i></button>' +
        '<button class="btn btn-sm btn-outline-danger" onclick="deleteTrainer(' + t.id + ')" title="Deactivate"><i class="bi bi-trash"></i></button>';
    }
    return '<tr>' +
      '<td class="fw-semibold">' + escapeHtml(t.full_name || '--') + '</td>' +
      '<td class="small"><code>' + escapeHtml(t.display_id || '--') + '</code></td>' +
      '<td class="small">' + escapeHtml(specs) + '</td>' +
      '<td>' + (t.experience_years || 0) + ' yrs</td>' +
      '<td>' + (t.assigned_members_count || 0) + '</td>' +
      '<td>' + (t.is_available ? '<span class="badge bg-success">Yes</span>' : '<span class="badge bg-secondary">No</span>') + '</td>' +
      '<td>' + actions + '</td>' +
    '</tr>';
  }).join('');
}

async function loadTrainerUsers() {
  var res = await apiRequest('/accounts/users/?role=TRAINER');
  if (!res || !res.ok) return;
  var data = await res.json();
  allUsers = data.results || data;
}

function openTrainerModal(trainer) {
  document.getElementById('trainerError').style.display = 'none';
  if (trainer) {
    document.getElementById('trainerModalTitle').textContent = 'Edit Trainer';
    document.getElementById('trainerId').value = trainer.id;
    document.getElementById('trainerUser').value = trainer.user;
    document.getElementById('trainerUser').disabled = true;
    document.getElementById('trainerAvailable').value = trainer.is_available ? 'true' : 'false';
    document.getElementById('trainerExperience').value = trainer.experience_years || '';
    document.getElementById('trainerSalary').value = trainer.salary || '';
    document.getElementById('trainerJoinedDate').value = trainer.joined_date || '';
    document.getElementById('trainerSpecializations').value = (trainer.specializations || []).join(', ');
    document.getElementById('trainerBio').value = trainer.bio || '';
  } else {
    document.getElementById('trainerModalTitle').textContent = 'Add Trainer';
    document.getElementById('trainerId').value = '';
    document.getElementById('trainerUser').disabled = false;
    document.getElementById('trainerAvailable').value = 'true';
    document.getElementById('trainerExperience').value = '';
    document.getElementById('trainerSalary').value = '';
    document.getElementById('trainerJoinedDate').value = '';
    document.getElementById('trainerSpecializations').value = '';
    document.getElementById('trainerBio').value = '';
  }

  var userSel = document.getElementById('trainerUser');
  userSel.innerHTML = allUsers.map(function(u) {
    var name = (u.first_name || '') + ' ' + (u.last_name || '');
    return '<option value="' + u.id + '">' + escapeHtml(name.trim() || u.email) + ' (' + escapeHtml(u.email) + ')</option>';
  }).join('');
  if (trainer) userSel.value = trainer.user;

  new bootstrap.Modal(document.getElementById('trainerModal')).show();
}

function editTrainer(id) {
  var t = allTrainers.find(function(x) { return x.id === id; });
  if (t) openTrainerModal(t);
}

async function submitTrainer() {
  var errBox = document.getElementById('trainerError');
  errBox.style.display = 'none';
  var id = document.getElementById('trainerId').value;
  var specsRaw = document.getElementById('trainerSpecializations').value.trim();
  var specs = specsRaw ? specsRaw.split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [];

  var payload = {
    user: parseInt(document.getElementById('trainerUser').value),
    is_available: document.getElementById('trainerAvailable').value === 'true',
    experience_years: document.getElementById('trainerExperience').value ? parseInt(document.getElementById('trainerExperience').value) : 0,
    salary: document.getElementById('trainerSalary').value || null,
    joined_date: document.getElementById('trainerJoinedDate').value || null,
    specializations: specs,
    bio: document.getElementById('trainerBio').value.trim(),
  };

  var url = id ? '/trainers/profiles/' + id + '/' : '/trainers/profiles/';
  var method = id ? 'PATCH' : 'POST';
  var res = await apiRequest(url, { method: method, body: JSON.stringify(payload) });
  if (!res) { errBox.textContent = 'Network error.'; errBox.style.display = ''; return; }
  if (res.ok) {
    bootstrap.Modal.getInstance(document.getElementById('trainerModal')).hide();
    loadTrainers();
  } else {
    var err = await res.json().catch(function() { return {}; });
    errBox.textContent = formatApiError(err);
    errBox.style.display = '';
  }
}

async function deleteTrainer(id) {
  if (!(await confirmAction('Deactivate this trainer? This will disable their login.', { confirmText: 'Deactivate', variant: 'danger', icon: 'bi-trash' }))) return;
  var res = await apiRequest('/trainers/profiles/' + id + '/', { method: 'DELETE' });
  if (res && (res.ok || res.status === 204)) loadTrainers();
}

// Init
loadTrainerUsers().then(loadTrainers);
loadTopbarNotifications();
</script>
</body>
</html>
