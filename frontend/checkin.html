<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Check In — FitCore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    :root {
      --brand: #6c63ff;
      --brand-dark: #574fd6;
      --success-green: #22c55e;
      --checkout-orange: #f97316;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100dvh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 1rem;
    }

    .checkin-card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 1.5rem;
      padding: 2rem 1.75rem;
      width: 100%;
      max-width: 420px;
      color: #fff;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .gym-logo {
      width: 64px;
      height: 64px;
      background: var(--brand);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1rem;
    }

    h1 { font-size: 1.5rem; font-weight: 700; }
    .sub-text { color: rgba(255,255,255,0.6); font-size: 0.9rem; }

    .form-control, .form-select {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 1rem;
    }
    .form-control:focus, .form-select:focus {
      background: rgba(255,255,255,0.15);
      border-color: var(--brand);
      color: #fff;
      box-shadow: 0 0 0 3px rgba(108,99,255,0.35);
      outline: none;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.4); }

    /* Make autofill look right on mobile browsers */
    .form-control:-webkit-autofill {
      -webkit-box-shadow: 0 0 0px 1000px rgba(48, 43, 99, 0.9) inset !important;
      -webkit-text-fill-color: #fff !important;
    }

    .btn-checkin {
      background: var(--brand);
      border: none;
      border-radius: 0.75rem;
      color: #fff;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 0.8rem;
      width: 100%;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-checkin:hover { background: var(--brand-dark); }
    .btn-checkin:active { transform: scale(0.98); }
    .btn-checkin:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Result screen ───────────────────────────────────────────────────── */
    #resultScreen { display: none; }

    .result-icon {
      font-size: 5rem;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .result-icon.success { color: var(--success-green); }
    .result-icon.checkout { color: var(--checkout-orange); }
    .result-icon.already { color: #facc15; }

    .result-name {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .result-meta {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
    }

    .time-pill {
      display: inline-block;
      background: rgba(255,255,255,0.12);
      border-radius: 2rem;
      padding: 0.25rem 0.9rem;
      font-size: 0.85rem;
      margin: 0.2rem;
    }

    .btn-again {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 0.75rem;
      color: rgba(255,255,255,0.8);
      padding: 0.6rem 1.5rem;
      font-size: 0.95rem;
      margin-top: 1rem;
      transition: background 0.2s;
    }
    .btn-again:hover { background: rgba(255,255,255,0.1); color: #fff; }

    /* ── Error alert ─────────────────────────────────────────────────────── */
    .alert-glass {
      background: rgba(239,68,68,0.2);
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: 0.75rem;
      color: #fca5a5;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
    }

    .divider {
      border-top: 1px solid rgba(255,255,255,0.1);
      margin: 1.25rem 0;
    }

    /* Spinner inside button */
    .spinner-sm {
      width: 1rem; height: 1rem;
      border-width: 2px;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }

    /* Membership status pill */
    .membership-pill {
      display: inline-block;
      border-radius: 2rem;
      padding: 0.2rem 0.8rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .membership-active { background: rgba(34,197,94,0.2); color: #86efac; border: 1px solid rgba(34,197,94,0.3); }
    .membership-expired { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
  </style>
</head>
<body>

<div class="checkin-card">

  <!-- ── Header ────────────────────────────────────────────────── -->
  <div class="text-center mb-3">
    <div class="gym-logo"><i class="bi bi-lightning-charge-fill text-white"></i></div>
    <h1>FitCore</h1>
    <p class="sub-text mb-0">Gym Check-In</p>
  </div>

  <!-- ── Login / Check-in Form ─────────────────────────────────── -->
  <div id="loginScreen">
    <div class="divider"></div>

    <div id="errorBox" class="alert-glass mb-3" style="display:none;"></div>

    <form id="checkinForm" autocomplete="on">
      <div class="mb-3">
        <label class="form-label text-white-50 small mb-1">Email</label>
        <input type="email" id="emailInput" class="form-control"
               placeholder="your@email.com"
               autocomplete="email"
               inputmode="email"
               required>
      </div>
      <div class="mb-3">
        <label class="form-label text-white-50 small mb-1">Password</label>
        <div class="position-relative">
          <input type="password" id="passwordInput" class="form-control"
                 placeholder="••••••••"
                 autocomplete="current-password"
                 required>
          <button type="button"
                  class="btn btn-sm position-absolute top-50 end-0 translate-middle-y pe-3 border-0 bg-transparent text-white-50"
                  onclick="togglePassword()" tabindex="-1">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-checkin" id="submitBtn">
        <i class="bi bi-qr-code-scan me-2"></i>Check In
      </button>
    </form>

    <p class="text-center mt-3 sub-text" style="font-size:0.8rem;">
      Your attendance will be recorded automatically after login.
    </p>
  </div>

  <!-- ── Result Screen ─────────────────────────────────────────── -->
  <div id="resultScreen" class="text-center">
    <div class="result-icon" id="resultIcon">✅</div>
    <div class="result-name mt-2" id="resultName"></div>
    <div class="result-meta" id="resultDisplayId"></div>

    <div class="mt-3" id="membershipBadge"></div>

    <div class="divider"></div>

    <div id="timeInfo" class="mb-1"></div>
    <div id="durationInfo" class="result-meta mt-1"></div>

    <div class="sub-text mt-3" id="resultMessage"></div>

    <button class="btn-again" onclick="resetForm()">
      <i class="bi bi-arrow-repeat me-1"></i>Check In Another Member
    </button>
  </div>

</div>

<script>
  const API_BASE = 'http://localhost:8000/api';

  // ── Helpers ────────────────────────────────────────────────────────────────
  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = msg;
    box.style.display = 'block';
  }
  function hideError() {
    document.getElementById('errorBox').style.display = 'none';
  }

  function togglePassword() {
    const inp = document.getElementById('passwordInput');
    const icon = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
      inp.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      inp.type = 'password';
      icon.className = 'bi bi-eye';
    }
  }

  function setLoading(loading) {
    const btn = document.getElementById('submitBtn');
    if (loading) {
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-sm"></span>Checking in…`;
    } else {
      btn.disabled = false;
      btn.innerHTML = `<i class="bi bi-qr-code-scan me-2"></i>Check In`;
    }
  }

  function formatTime(timeStr) {
    if (!timeStr) return '—';
    // timeStr is "HH:MM:SS" from Django
    const [h, m] = timeStr.split(':');
    const hour = parseInt(h);
    const ampm = hour >= 12 ? 'PM' : 'AM';
    const h12  = hour % 12 || 12;
    return `${h12}:${m} ${ampm}`;
  }

  // ── Main flow ──────────────────────────────────────────────────────────────
  document.getElementById('checkinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();

    const email    = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;

    if (!email || !password) {
      showError('Please enter your email and password.');
      return;
    }

    setLoading(true);

    try {
      // Step 1 — Login
      const loginRes = await fetch(`${API_BASE}/auth/login/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      if (!loginRes.ok) {
        const err = await loginRes.json().catch(() => ({}));
        const msg = err.detail || err.non_field_errors?.[0] || 'Invalid email or password.';
        showError(msg);
        setLoading(false);
        return;
      }

      const loginData = await loginRes.json();
      const accessToken = loginData.access;
      const userRole = loginData.role || loginData.user?.role || '';

      // Only members can use this check-in page
      if (userRole && userRole !== 'MEMBER') {
        showError('This check-in page is for gym members only.');
        setLoading(false);
        return;
      }

      // Step 2 — Get today's attendance token and scan it
      // Members use their individual QR token for check-in.
      // We get the token, then call the scan endpoint.
      const tokenRes = await fetch(`${API_BASE}/attendance/qr/my/`, {
        headers: { 'Authorization': `Bearer ${accessToken}` },
      });

      if (!tokenRes.ok) {
        showError('Could not retrieve your check-in token. Please contact staff.');
        setLoading(false);
        return;
      }

      const tokenData = await tokenRes.json();

      // Step 3 — Scan (check in / check out)
      const scanRes = await fetch(`${API_BASE}/attendance/qr/scan/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: tokenData.token }),
      });

      if (!scanRes.ok) {
        const err = await scanRes.json().catch(() => ({}));
        showError(err.error || 'Check-in failed. Please try again.');
        setLoading(false);
        return;
      }

      const result = await scanRes.json();

      // Step 4 — Also fetch membership info while we have the token
      let membershipInfo = null;
      try {
        const profileRes = await fetch(`${API_BASE}/attendance/member-profile/${tokenData.member_id}/`);
        if (profileRes.ok) {
          const profile = await profileRes.json();
          membershipInfo = profile.membership;
        }
      } catch (_) { /* non-critical */ }

      showResult(result, membershipInfo);

    } catch (err) {
      showError('Network error. Make sure you are connected to the gym WiFi.');
    }

    setLoading(false);
  });

  // ── Show result ────────────────────────────────────────────────────────────
  function showResult(data, membership) {
    document.getElementById('loginScreen').style.display  = 'none';
    document.getElementById('resultScreen').style.display = 'block';

    const iconEl   = document.getElementById('resultIcon');
    const msgEl    = document.getElementById('resultMessage');
    const timeEl   = document.getElementById('timeInfo');
    const durEl    = document.getElementById('durationInfo');

    // Action
    if (data.action === 'checked_in') {
      iconEl.textContent = '✅';
      iconEl.className   = 'result-icon success';
      msgEl.textContent  = 'Welcome! Have a great workout 💪';
    } else if (data.action === 'checked_out') {
      iconEl.textContent = '👋';
      iconEl.className   = 'result-icon checkout';
      msgEl.textContent  = 'See you next time!';
    } else {
      iconEl.textContent = '⚠️';
      iconEl.className   = 'result-icon already';
      msgEl.textContent  = 'Attendance already completed for today.';
    }

    document.getElementById('resultName').textContent      = data.member_name || '—';
    document.getElementById('resultDisplayId').textContent = data.display_id  ? `#${data.display_id}` : '';

    // Membership badge
    const badgeEl = document.getElementById('membershipBadge');
    if (membership) {
      const cls = membership.status === 'ACTIVE' ? 'membership-active' : 'membership-expired';
      badgeEl.innerHTML = `
        <span class="membership-pill ${cls}">
          <i class="bi bi-card-checklist me-1"></i>${membership.plan_name} · ${membership.status}
        </span>`;
    } else {
      badgeEl.innerHTML = '';
    }

    // Times
    const checkIn  = formatTime(data.check_in);
    const checkOut = formatTime(data.check_out);

    if (data.action === 'checked_out' || data.check_out) {
      timeEl.innerHTML = `
        <span class="time-pill"><i class="bi bi-box-arrow-in-right me-1"></i>In: ${checkIn}</span>
        <span class="time-pill"><i class="bi bi-box-arrow-right me-1"></i>Out: ${checkOut}</span>`;
      if (data.duration_minutes != null) {
        durEl.textContent = `Total: ${data.duration_minutes} min`;
      }
    } else {
      timeEl.innerHTML = `<span class="time-pill"><i class="bi bi-clock me-1"></i>Checked in at ${checkIn}</span>`;
      durEl.textContent = '';
    }

    // Auto-reset after 8 seconds for the next member
    setTimeout(resetForm, 8000);
  }

  // ── Reset to login form ────────────────────────────────────────────────────
  function resetForm() {
    document.getElementById('checkinForm').reset();
    document.getElementById('passwordInput').type = 'password';
    document.getElementById('eyeIcon').className  = 'bi bi-eye';
    hideError();
    document.getElementById('loginScreen').style.display  = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('emailInput').focus();
  }
</script>

</body>
</html>
