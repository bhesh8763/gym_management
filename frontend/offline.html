<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1015">
  <link rel="icon" type="image/png" href="logo.png">
  <title>Offline — FitCore</title>
  <style>
    /* Self-contained on purpose: this page must render with no network. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0f1015;
      color: #e5e7eb;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #14151b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px 28px;
    }
    .card img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 20px;
      border-radius: 16px;
      background: #0f1015;
    }
    .card h1 { font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 10px; }
    .card p { font-size: 0.95rem; line-height: 1.6; color: #9ca3af; margin-bottom: 26px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block;
      padding: 11px 22px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: #e63946; color: #fff; }
    .btn-primary:hover { background: #c62f3b; }
    .btn-ghost { background: transparent; color: #e5e7eb; border: 1px solid rgba(255, 255, 255, 0.2); }
    .btn-ghost:hover { border-color: #e63946; color: #fff; }
  </style>
  <!-- PWA: installable app + service-worker registration (scripts/inject_pwa_tags.py) -->
  <meta name="theme-color" content="#0f1015">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <script src="js/pwa.js" defer></script>
</head>
<body>
  <main class="card">
    <img src="logo.png" alt="FitCore logo">
    <h1>You're offline</h1>
    <p>
      This page needs an internet connection. Check your network and try
      again — your data is safe and will load as soon as you're back online.
    </p>
    <div class="actions">
      <button class="btn btn-primary" onclick="location.reload()">Try again</button>
      <a class="btn btn-ghost" href="./">Go to home</a>
    </div>
  </main>
</body>
</html>
