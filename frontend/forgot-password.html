<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — FitCore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/login.css" rel="stylesheet">
</head>
<body>

<div class="login-bg"></div>

<div class="login-container">

  <!-- Left side - Branding -->
  <div class="login-left">
    <a href="login.html" class="login-back-link">
      <i class="bi bi-arrow-left"></i> Back to Login
    </a>

    <div class="login-branding">
      <div class="login-logo">
        <img src="logo.png" alt="FitCore" style="height:48px;width:48px;object-fit:contain;">
      </div>
      <h1 class="login-brand-name">FitCore</h1>
      <p class="login-brand-tagline">We'll help you get back into your account.</p>
    </div>

    <div class="login-features">
      <div class="login-feature-item">
        <i class="bi bi-check-circle-fill"></i>
        <span>Enter your registered email</span>
      </div>
      <div class="login-feature-item">
        <i class="bi bi-check-circle-fill"></i>
        <span>Check your inbox for a reset link</span>
      </div>
      <div class="login-feature-item">
        <i class="bi bi-check-circle-fill"></i>
        <span>Create a new secure password</span>
      </div>
    </div>
  </div>

  <!-- Right side - Forgot Password form -->
  <div class="login-right">
    <div class="login-card">
      <div class="login-card-header">
        <h2>Forgot Password?</h2>
        <p>Enter your email and we'll send you a reset link</p>
      </div>

      <div id="errorBox" class="login-alert login-alert-danger d-none"></div>
      <div id="successBox" class="login-alert d-none"></div>

      <!-- Request form -->
      <form id="forgotForm" class="login-form" autocomplete="on">
        <div class="login-form-group">
          <label class="login-label">Email Address</label>
          <div class="login-input-wrapper">
            <i class="bi bi-envelope-fill"></i>
            <input type="email" class="login-input" id="email" name="email" placeholder="your@email.com" required autofocus autocomplete="email">
          </div>
        </div>

        <button type="submit" class="login-btn-primary">
          <span>Send Reset Link</span>
          <i class="bi bi-envelope-check"></i>
        </button>
      </form>

      <div class="login-divider">
        <span>or</span>
      </div>

      <div class="login-register-prompt">
        <a href="login.html" class="login-register-link">Back to Sign In</a>
      </div>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/validate.js"></script>
<script>
  window.addEventListener('load', () => {
    document.getElementById('email').value = '';
  });

  const forgotRules = {
    email: [
      v => validate.required(v, 'Email'),
      v => validate.email(v),
    ],
  };

  initFormValidation(document.getElementById('forgotForm'), forgotRules, async (form) => {
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    errorBox.classList.add('d-none');
    successBox.classList.add('d-none');

    const email = document.getElementById('email').value.trim();

    try {
      const res = await fetch(`${API_BASE}/auth/forgot-password/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();

      if (res.ok) {
        // Hide the form and show success
        document.getElementById('forgotForm').style.display = 'none';
        successBox.style.backgroundColor = 'rgba(16,185,129,0.1)';
        successBox.style.color = '#059669';
        successBox.style.borderLeft = '3px solid #10b981';
        successBox.innerHTML = `
          <div class="d-flex align-items-start gap-3">
            <i class="bi bi-check-circle-fill fs-4"></i>
            <div>
              <strong>Check your email!</strong>
              <p class="mb-0 mt-1" style="font-size:0.9rem;">If an account exists with <strong>${email}</strong>, we've sent a password reset link. Check your inbox and spam folder.</p>
              <p class="mt-2 mb-0" style="font-size:0.85rem;">The link expires in 1 hour.</p>
            </div>
          </div>
        `;
        successBox.classList.remove('d-none');
      } else {
        errorBox.textContent = data.error || 'Something went wrong. Please try again.';
        errorBox.classList.remove('d-none');
      }
    } catch (err) {
      errorBox.textContent = 'Network error. Please try again.';
      errorBox.classList.remove('d-none');
    }
  });
</script>
</body>
</html>
