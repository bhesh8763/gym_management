<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitCore — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/login.css" rel="stylesheet">
</head>
<body>

<!-- Background with gradient -->
<div class="login-bg"></div>

<!-- Main container -->
<div class="login-container">
  
  <!-- Left side - Branding -->
  <div class="login-left">
    <a href="http://localhost:5500/" class="login-back-link">
      <i class="bi bi-arrow-left"></i> Back to Home
    </a>
    
    <div class="login-branding">
      <div class="login-logo">
        <img src="logo.png" alt="FitCore">
      </div>
      <h1 class="login-brand-name">FitCore</h1>
      <p class="login-brand-tagline">Your Complete Gym Management Solution</p>
    </div>

    <div class="login-features">
      <div class="login-feature-item">
        <i class="bi bi-check-circle-fill"></i>
        <span>Track memberships & attendance</span>
      </div>
      <div class="login-feature-item">
        <i class="bi bi-check-circle-fill"></i>
        <span>Manage payments & reports</span>
      </div>
      <div class="login-feature-item">
        <i class="bi bi-check-circle-fill"></i>
        <span>Custom workout & diet plans</span>
      </div>
    </div>
  </div>

  <!-- Right side - Login form -->
  <div class="login-right">
    <div class="login-card">
      <div class="login-card-header">
        <h2>Welcome Back</h2>
        <p>Sign in to your FitCore account</p>
      </div>

      <div id="errorBox" class="login-alert login-alert-danger d-none"></div>

      <form id="loginForm" class="login-form" autocomplete="on">
        <div class="login-form-group">
          <label class="login-label">Email Address</label>
          <div class="login-input-wrapper">
            <i class="bi bi-envelope-fill"></i>
            <input type="email" class="login-input" id="email" name="email" placeholder="your@email.com" required autofocus autocomplete="email">
          </div>
        </div>

        <div class="login-form-group">
          <label class="login-label">Password</label>
          <div class="login-input-wrapper">
            <i class="bi bi-lock-fill"></i>
            <input type="password" class="login-input" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="login-toggle-password toggle-password" data-target="password" tabindex="-1">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="login-form-footer">
          <label class="login-checkbox">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="#" class="login-forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn-primary">
          <span>Sign In</span>
          <i class="bi bi-arrow-right-short"></i>
        </button>
      </form>

      <div class="login-divider">
        <span>or continue with</span>
      </div>

      <div class="login-social-buttons">
        <button type="button" class="login-social-btn login-social-google" onclick="socialLogin('google')">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button type="button" class="login-social-btn login-social-facebook" onclick="socialLogin('facebook')">
          <i class="bi bi-facebook"></i>
          Facebook
        </button>
      </div>

      <div class="login-register-prompt">
        Don't have an account? <a href="signup.html" class="login-register-link">Sign up</a>
      </div>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/validate.js"></script>
<script>
  // Clear fields on load — prevents browser from silently pre-filling
  // a saved/generated password before the user interacts with the form.
  // The autocomplete attributes are kept so the browser still *offers*
  // its credential picker when the user clicks into the field.
  window.addEventListener('load', () => {
    document.getElementById('email').value = '';
    document.getElementById('password').value = '';
  });

  const loginRules = {
    email: [
      v => validate.required(v, 'Email'),
      v => validate.email(v),
    ],
    password: [
      v => validate.required(v, 'Password'),
    ],
  };

  initFormValidation(document.getElementById('loginForm'), loginRules, async (form) => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('errorBox');
    errorBox.classList.add('d-none');

    const res = await fetch(`${API_BASE}/auth/login/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();

    if (res.ok) {
      saveTokens(data.access, data.refresh);
      localStorage.setItem('user_id', data.user.id);
      localStorage.setItem('user_role', data.user.role);
      localStorage.setItem('user_name', data.user.full_name);
      localStorage.setItem('user_picture', data.user.profile_picture || '');
      // Route trainers to their dedicated dashboard
      const role = data.user.role;
      window.location.href = role === 'TRAINER' ? 'trainer-dashboard.html' : 'dashboard.html';
    } else {
      errorBox.textContent = data.detail || 'Login failed. Check your credentials.';
      errorBox.classList.remove('d-none');
    }
  });

  function socialLogin(provider) {
    window.location.href = `${API_BASE}/auth/${provider}/login/`;
  }
</script>
</body>
</html>
