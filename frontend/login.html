<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="LOGO-2.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitCore — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/login.css" rel="stylesheet">
</head>
<body>

<!-- Background with gradient -->
<div class="login-bg"></div>

<!-- Main container -->
<div class="login-container">
  
  <!-- Left side - Branding -->
  <div class="login-left">
    <a href="/" class="login-back-link">
      <i class="bi bi-arrow-left"></i> Back to Home
    </a>
    
    <div class="login-branding">
      <div class="login-logo">
        <img src="LOGO-2.png" alt="FitCore" style="width:220px;height:220px;object-fit:contain;filter:drop-shadow(0 8px 32px rgba(230,57,70,0.5));">
      </div>
      <a href="/" style="text-decoration:none;color:inherit;"><h1 class="login-brand-name">FitCore</h1></a>
      <p class="login-brand-tagline">Your Complete Gym Management Solution</p>
    </div>

    <div class="login-features">
      <div class="login-feature-item">
        <i class="bi bi-check-circle-fill"></i>
        <span>Track memberships & attendance</span>
      </div>
      <div class="login-feature-item">
        <i class="bi bi-check-circle-fill"></i>
        <span>Manage payments & reports</span>
      </div>
      <div class="login-feature-item">
        <i class="bi bi-check-circle-fill"></i>
        <span>Custom workout & diet plans</span>
      </div>
    </div>
  </div>

  <!-- Right side - Login form -->
  <div class="login-right">
    <div class="login-card">
      <div class="login-card-header">
        <h2>Welcome Back</h2>
        <p>Sign in to your FitCore account</p>
      </div>

      <div id="errorBox" class="login-alert login-alert-danger d-none"></div>

      <form id="loginForm" class="login-form" autocomplete="on">
        <div class="login-form-group">
          <label class="login-label">Email Address</label>
          <div class="login-input-wrapper">
            <i class="bi bi-envelope-fill"></i>
            <input type="email" class="login-input" id="email" name="email" placeholder="your@email.com" required autofocus autocomplete="email">
          </div>
        </div>

        <div class="login-form-group">
          <label class="login-label">Password</label>
          <div class="login-input-wrapper">
            <i class="bi bi-lock-fill"></i>
            <input type="password" class="login-input" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="login-toggle-password toggle-password" data-target="password" tabindex="-1">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="login-form-footer">
          <label class="login-checkbox">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="forgot-password.html" class="login-forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn-primary">
          <span>Sign In</span>
          <i class="bi bi-arrow-right-short"></i>
        </button>
      </form>

      <div class="login-divider">
        <span>or</span>
      </div>

      <div class="login-register-prompt">
        Don't have an account? <a href="signup.html" class="login-register-link">Sign up</a>
      </div>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('errorBox');
    errorBox.classList.add('d-none');

    const res = await fetch(`${API_BASE}/auth/login/`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();

    if (res.ok) {
      saveTokens(data.access, data.refresh);
      localStorage.setItem('user_id', data.user.id);
      localStorage.setItem('user_role', data.user.role);
      localStorage.setItem('user_name', data.user.full_name);
      localStorage.setItem('user_picture', data.user.profile_picture || '');
      window.location.href = 'dashboard.html';
    } else {
      errorBox.textContent = data.detail || 'Login failed. Check your credentials.';
      errorBox.classList.remove('d-none');
    }
  });
</script>
</body>
</html>
