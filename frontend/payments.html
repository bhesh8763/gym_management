<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payments — Gym Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Gym Management</span>
    <div class="d-flex align-items-center text-white">
      <span id="userLabel" class="me-3"></span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
    </div>
  </nav>

  <div class="d-flex">
    <div class="sidebar">
      <div class="list-group list-group-flush pt-2">
        <a href="dashboard.html" class="list-group-item"><i class="bi bi-arrow-left"></i> Dashboard</a>
<a href="attendance.html" class="list-group-item list-group-item-action"><i class="bi bi-calendar-check"></i> Attendance</a>
<a href="payments.html" class="list-group-item list-group-item-action active"><i class="bi bi-cash-coin"></i> Payments</a>
<a href="staff.html" class="list-group-item list-group-item-action"><i class="bi bi-people"></i> Staff</a>
<a href="lockers.html" class="list-group-item list-group-item-action"><i class="bi bi-lock"></i> Lockers</a>
<a href="equipment.html" class="list-group-item list-group-item-action"><i class="bi bi-tools"></i> Equipment</a>
      </div>
    </div>

    <div class="p-4 flex-grow-1">
      <h3>Payments</h3>

      <!-- Summary -->
      <div class="row mb-4">
        <div class="col-md-4">
          <div class="card text-center border-success"><div class="card-body">
            <div class="text-muted small">Total Collected</div>
            <h3 id="statCollected" class="text-success">-</h3>
          </div></div>
        </div>
        <div class="col-md-4">
          <div class="card text-center border-warning"><div class="card-body">
            <div class="text-muted small">Pending</div>
            <h3 id="statPending" class="text-warning">-</h3>
          </div></div>
        </div>
        <div class="col-md-4">
          <div class="card text-center border-secondary"><div class="card-body">
            <div class="text-muted small">Total Transactions</div>
            <h3 id="statCount" class="text-secondary">-</h3>
          </div></div>
        </div>
      </div>

      <h5>Record New Payment</h5>
      <form id="addForm" class="row g-2 mb-4 align-items-end">
        <div class="col-auto">
          <label class="form-label">Member ID</label>
          <input type="number" id="member" class="form-control" required>
        </div>
        <div class="col-auto">
          <label class="form-label">For</label>
          <select id="paymentFor" class="form-select">
            <option value="MEMBERSHIP">Membership</option>
            <option value="LOCKER">Locker</option>
            <option value="PT">Personal Training</option>
            <option value="OTHER">Other</option>
          </select>
        </div>
        <div class="col-auto">
          <label class="form-label">Amount (NPR)</label>
          <input type="number" step="0.01" id="amount" class="form-control" required>
        </div>
        <div class="col-auto">
          <label class="form-label">Discount</label>
          <input type="number" step="0.01" id="discount" class="form-control" value="0">
        </div>
        <div class="col-auto">
          <label class="form-label">Method</label>
          <select id="method" class="form-select">
            <option value="CASH">Cash</option>
            <option value="ESEWA">eSewa</option>
            <option value="KHALTI">Khalti</option>
            <option value="BANK">Bank Transfer</option>
            <option value="CARD">Card</option>
            <option value="OTHER">Other</option>
          </select>
        </div>
        <div class="col-auto">
          <label class="form-label">Status</label>
          <select id="status" class="form-select">
            <option value="PAID">Paid</option>
            <option value="PENDING">Pending</option>
            <option value="PARTIAL">Partially Paid</option>
          </select>
        </div>
        <div class="col-auto">
          <label class="form-label">Receipt #</label>
          <input type="text" id="receiptNumber" class="form-control" required>
        </div>
        <div class="col-auto">
          <button type="submit" class="btn btn-primary">Record Payment</button>
        </div>
      </form>

      <div id="errorBox" class="alert alert-danger d-none"></div>

      <h5>Filter</h5>
      <div class="row g-2 mb-3">
        <div class="col-auto">
          <select id="filterStatus" class="form-select" onchange="loadPayments()">
            <option value="">All Statuses</option>
            <option value="PAID">Paid</option>
            <option value="PENDING">Pending</option>
            <option value="PARTIAL">Partially Paid</option>
            <option value="REFUNDED">Refunded</option>
            <option value="FAILED">Failed</option>
          </select>
        </div>
      </div>

      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Receipt #</th><th>Member</th><th>For</th><th>Amount</th>
            <th>Discount</th><th>Paid</th><th>Method</th><th>Status</th><th>Collected By</th>
          </tr>
        </thead>
        <tbody id="payTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (!getAccessToken()) window.location.href = 'index.html';
    document.getElementById('userLabel').textContent =
      `${localStorage.getItem('user_name')} (${localStorage.getItem('user_role')})`;

    function logout() {
      clearTokens();
      window.location.href = 'index.html';
    }

    function statusBadge(status) {
      const map = {
        PAID: 'success', PENDING: 'warning', FAILED: 'danger',
        REFUNDED: 'secondary', PARTIAL: 'info',
      };
      return `<span class="badge bg-${map[status] || 'secondary'}">${status}</span>`;
    }

    async function loadPayments() {
      const statusFilter = document.getElementById('filterStatus').value;
      let path = '/payments/' + (statusFilter ? `?status=${statusFilter}` : '');

      let all = [];
      while (path) {
        const res = await apiRequest(path);
        if (!res) return;
        const data = await res.json();
        all = all.concat(data.results);
        path = data.next ? data.next.replace(API_BASE, '') : null;
      }

      const tbody = document.getElementById('payTableBody');
      tbody.innerHTML = '';
      let collected = 0, pending = 0;
      all.forEach(row => {
        if (row.status === 'PAID') collected += parseFloat(row.amount_paid);
        if (row.status === 'PENDING') pending += parseFloat(row.amount_paid);
        tbody.innerHTML += `
          <tr>
            <td>${row.receipt_number}</td>
            <td>${row.member_name}</td>
            <td>${row.payment_for}</td>
            <td>${row.amount}</td>
            <td>${row.discount}</td>
            <td>${row.amount_paid}</td>
            <td>${row.payment_method}</td>
            <td>${statusBadge(row.status)}</td>
            <td>${row.collected_by_name || '-'}</td>
          </tr>`;
      });

      document.getElementById('statCollected').textContent = 'NPR ' + collected.toFixed(2);
      document.getElementById('statPending').textContent = 'NPR ' + pending.toFixed(2);
      document.getElementById('statCount').textContent = all.length;
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('errorBox');
      errorBox.classList.add('d-none');

      const payload = {
        member: parseInt(document.getElementById('member').value),
        payment_for: document.getElementById('paymentFor').value,
        amount: document.getElementById('amount').value,
        discount: document.getElementById('discount').value,
        payment_method: document.getElementById('method').value,
        status: document.getElementById('status').value,
        receipt_number: document.getElementById('receiptNumber').value,
      };

      const res = await apiRequest('/payments/', { method: 'POST', body: JSON.stringify(payload) });
      if (!res) return;

      if (res.ok) {
        document.getElementById('addForm').reset();
        loadPayments();
      } else {
        const err = await res.json();
        errorBox.textContent = JSON.stringify(err);
        errorBox.classList.remove('d-none');
      }
    });

    loadPayments();
  </script>
</body>
</html>
