<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard — Gym Management</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/theme.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark px-3">
      <span class="navbar-brand">Gym Management</span>
      <div class="d-flex align-items-center text-white">
        <span id="userLabel" class="me-3"></span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">
          Logout
        </button>
      </div>
    </nav>

    <div class="d-flex">
      <div class="sidebar">
        <div class="list-group list-group-flush pt-2">
          <a href="dashboard.html" class="list-group-item"
            ><i class="bi bi-arrow-left"></i> Dashboard</a
          >
          <a
            href="attendance.html"
            class="list-group-item list-group-item-action"
            ><i class="bi bi-calendar-check"></i> Attendance</a
          >
          <a href="payments.html" class="list-group-item list-group-item-action"
            ><i class="bi bi-cash-coin"></i> Payments</a
          >
          <a href="staff.html" class="list-group-item list-group-item-action"
            ><i class="bi bi-people"></i> Staff</a
          >
          <a href="lockers.html" class="list-group-item list-group-item-action"
            ><i class="bi bi-lock"></i> Lockers</a
          >
          <a
            href="equipment.html"
            class="list-group-item list-group-item-action"
            ><i class="bi bi-tools"></i> Equipment</a
          >
        </div>
      </div>
      <div class="p-4 flex-grow-1">
        <h3>Welcome</h3>
        <p class="text-muted">Select a module from the sidebar.</p>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      if (!getAccessToken()) window.location.href = "index.html";
      document.getElementById("userLabel").textContent =
        `${localStorage.getItem("user_name")} (${localStorage.getItem("user_role")})`;

      function logout() {
        clearTokens();
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
