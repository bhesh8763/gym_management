<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — FitCore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  /* ── Messages Page Layout ────────────────────────────────────────────── */
  .msg-page { display: grid; grid-template-columns: 340px 1fr; grid-template-rows: minmax(0, 1fr); height: calc(100vh - 60px); overflow: hidden; }
  .msg-page .msg-list-panel, .msg-page .msg-chat-panel { min-height: 0; }
  @media (max-width: 900px) { .msg-page { grid-template-columns: 1fr; } .msg-page.hide-list .msg-list-panel { display: none; } .msg-page.hide-chat .msg-chat-panel { display: none; } }

  /* ── Left: Conversation List ─────────────────────────────────────────── */
  .msg-list-panel { border-right: 1px solid var(--border-light, #e5e7eb); display: flex; flex-direction: column; background: var(--bg-card, #fff); }
  .msg-list-header { padding: 18px 16px 12px; border-bottom: 1px solid var(--border-light, #e5e7eb); }
  .msg-list-header h5 { margin: 0; font-size: 1.1rem; font-weight: 700; }
  .msg-list-header .badge { font-size: 0.7rem; }
  .msg-search { padding: 10px 16px; border-bottom: 1px solid var(--border-light, #e5e7eb); }
  .msg-search input { width: 100%; padding: 8px 12px; border: 1px solid var(--border-light, #e5e7eb); border-radius: var(--radius-md, 8px); font-size: 0.82rem; background: var(--bg-root, #f8f9fa); color: var(--text-primary, #1a1a1f); }
  .msg-search input:focus { outline: none; border-color: var(--brand-red, #e63946); box-shadow: 0 0 0 2px rgba(230,57,70,0.1); }
  .msg-list { flex: 1; overflow-y: auto; }
  .msg-conversation-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-light, #f0f0f0); cursor: pointer; transition: background 0.15s; }
  .msg-conversation-item:hover { background: var(--bg-hover, #f5f5f5); }
  .msg-conversation-item.active { background: rgba(230,57,70,0.06); border-left: 3px solid var(--brand-red, #e63946); }
  .msg-conversation-item .msg-conv-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--brand-red), var(--brand-red-light, #ff6b6b)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; flex-shrink: 0; }
  .msg-conversation-item .msg-conv-body { flex: 1; min-width: 0; }
  .msg-conversation-item .msg-conv-name { font-weight: 600; font-size: 0.85rem; color: var(--text-primary, #1a1a1f); display: flex; align-items: center; gap: 6px; }
  .msg-conversation-item .msg-conv-preview { font-size: 0.75rem; color: var(--text-muted, #888); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .msg-conversation-item .msg-conv-meta { text-align: right; flex-shrink: 0; }
  .msg-conversation-item .msg-conv-time { font-size: 0.68rem; color: var(--text-muted, #aaa); }
  .msg-conversation-item .msg-conv-unread { width: 18px; height: 18px; border-radius: 50%; background: var(--brand-red, #e63946); color: #fff; font-size: 0.6rem; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 4px; margin-left: auto; }
  .msg-empty-list { text-align: center; padding: 40px 20px; color: var(--text-muted, #888); }
  .msg-empty-list i { font-size: 2rem; opacity: 0.3; display: block; margin-bottom: 8px; }

  /* ── Right: Chat Panel ──────────────────────────────────────────────── */
  .msg-chat-panel { display: flex; flex-direction: column; background: var(--bg-root, #f8f9fa); }
  .msg-chat-header { padding: 14px 20px; background: var(--bg-card, #fff); border-bottom: 1px solid var(--border-light, #e5e7eb); display: flex; align-items: center; gap: 12px; }
  .msg-chat-header .msg-back-btn { display: none; background: none; border: none; color: var(--text-muted, #888); font-size: 1.2rem; cursor: pointer; padding: 4px; }
  @media (max-width: 900px) { .msg-chat-header .msg-back-btn { display: block; } }
  .msg-chat-header .msg-chat-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--brand-red), var(--brand-red-light, #ff6b6b)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
  .msg-chat-header .msg-chat-name { font-weight: 700; font-size: 0.95rem; }
  .msg-chat-header .msg-chat-sub { font-size: 0.72rem; color: var(--text-muted, #888); }

  /* Messages area */
  .msg-chat-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  .msg-chat-empty { text-align: center; margin: auto; color: var(--text-muted, #888); }
  .msg-chat-empty i { font-size: 3rem; opacity: 0.2; display: block; margin-bottom: 10px; }
  .msg-bubble { max-width: 70%; padding: 10px 14px; border-radius: 16px; font-size: 0.85rem; line-height: 1.4; position: relative; }
  .msg-bubble.sent { align-self: flex-end; background: var(--brand-red, #e63946); color: #fff; border-bottom-right-radius: 4px; }
  .msg-bubble.received { align-self: flex-start; background: var(--bg-card, #fff); color: var(--text-primary, #1a1a1f); border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .msg-bubble .msg-bubble-sender { font-weight: 600; font-size: 0.72rem; margin-bottom: 2px; opacity: 0.8; }
  .msg-bubble .msg-bubble-time { font-size: 0.62rem; margin-top: 4px; opacity: 0.6; text-align: right; }
  .msg-date-divider { text-align: center; font-size: 0.7rem; color: var(--text-muted, #aaa); padding: 8px 0; }

  /* Reply input */
  .msg-chat-footer { padding: 12px 20px; background: var(--bg-card, #fff); border-top: 1px solid var(--border-light, #e5e7eb); }
  .msg-reply-row { display: flex; gap: 10px; align-items: flex-end; }
  .msg-reply-row textarea { flex: 1; resize: none; border: 1px solid var(--border-light, #e5e7eb); border-radius: 20px; padding: 10px 16px; font-size: 0.85rem; max-height: 120px; background: var(--bg-root, #f8f9fa); color: var(--text-primary, #1a1a1f); }
  .msg-reply-row textarea:focus { outline: none; border-color: var(--brand-red, #e63946); }
  .msg-reply-row .btn-send { width: 40px; height: 40px; border-radius: 50%; background: var(--brand-red, #e63946); color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
  .msg-reply-row .btn-send:hover { background: var(--brand-red-dark, #c62828); transform: scale(1.05); }
  .msg-reply-row .btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* No conversation selected */
  .msg-no-chat { display: flex; align-items: center; justify-content: center; height: 100%; }
  .msg-no-chat-inner { text-align: center; color: var(--text-muted, #888); }
  .msg-no-chat-inner i { font-size: 4rem; opacity: 0.15; display: block; margin-bottom: 12px; }
</style>
</head>
<body data-allowed-roles="TRAINER">

<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;">
  <div id="appToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="appToastBody">Saved.</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<nav class="topbar">
  <button class="sidebar-toggle" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
  <a href="trainer-dashboard.html" class="navbar-brand d-flex align-items-center text-decoration-none">
    <img src="logo.png" alt="FitCore" style="height:32px;width:32px;margin-right:8px;object-fit:contain;">
    <span style="font-size: 1.5rem; font-weight: 700;">FitCore</span>
  </a>
  <div class="topbar-search">
    <i class="bi bi-search"></i>
    <input type="text" id="globalSearch" placeholder="Search members by name, ID, or phone..." autocomplete="off">
    <div class="topbar-search-results" id="globalSearchResults"></div>
  </div>
  <div class="position-relative">
    <button class="topbar-icon-btn" onclick="toggleDropdown('notifPanel')">
      <i class="bi bi-bell"></i>
      <span class="notif-badge" id="notifCount" style="display:none;">0</span>
    </button>
    <div class="dropdown-panel" id="notifPanel">
      <div class="d-flex justify-content-between align-items-center px-3 pt-2 pb-1 border-bottom">
        <span class="fw-semibold small">Notifications</span>
        <button id="notifMarkAllBtn" class="btn btn-sm btn-link text-danger p-0 small" onclick="markAllTopbarNotificationsRead()" disabled>
          <i class="bi bi-check2-all me-1"></i>Mark all as read
        </button>
      </div>
      <div id="notifList"><div class="notif-empty">No notifications</div></div>
      <div class="border-top text-center py-2">
        <a href="notifications.html" class="small text-danger spa-link">View all</a>
      </div>
    </div>
  </div>
  <div class="position-relative">
    <button class="profile-trigger" onclick="toggleDropdown('profilePanel')">
      <span class="profile-avatar" id="profileAvatar">?</span>
      <span class="profile-meta">
        <div class="profile-name" id="profileName">–</div>
        <div class="profile-role" id="profileRole">–</div>
      </span>
      <i class="bi bi-chevron-down text-white-50"></i>
    </button>
    <div class="dropdown-panel profile-menu" id="profilePanel">
      <a href="javascript:void(0)" onclick="openEditProfileModal()"><i class="bi bi-person"></i> Profile</a>
      <hr>
      <button class="text-danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </div>
</nav>

<div id="page-content">
<div class="d-flex">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar"></div>

  <div class="flex-grow-1">
    <div class="msg-page" id="msgPage">

      <!-- Left: Conversation List -->
      <div class="msg-list-panel">
        <div class="msg-list-header">
          <div class="d-flex justify-content-between align-items-center">
            <h5><i class="bi bi-chat-dots me-2" style="color:var(--brand-red);"></i>Messages</h5>
            <span class="badge bg-danger d-none" id="totalUnreadBadge">0</span>
          </div>
        </div>
        <div class="msg-search">
          <input type="text" id="msgSearch" placeholder="Search conversations..." oninput="filterConversations()">
        </div>
        <div class="msg-list" id="conversationList">
          <div class="text-center py-4"><div class="spinner-border spinner-border-sm text-danger"></div></div>
        </div>
      </div>

      <!-- Right: Chat Panel -->
      <div class="msg-chat-panel">
        <!-- Default: no chat selected -->
        <div class="msg-no-chat" id="noChatPlaceholder">
          <div class="msg-no-chat-inner">
            <i class="bi bi-chat-dots"></i>
            <div style="font-size:1rem;font-weight:600;margin-bottom:4px;">Select a conversation</div>
            <div style="font-size:0.82rem;">Choose a member from the list to view messages</div>
          </div>
        </div>

        <!-- Chat view (hidden initially) -->
        <div id="chatView" style="display:none;flex-direction:column;height:100%;">
          <div class="msg-chat-header">
            <button class="msg-back-btn" onclick="showListPanel()"><i class="bi bi-arrow-left"></i></button>
            <div class="msg-chat-avatar" id="chatAvatar">?</div>
            <div>
              <div class="msg-chat-name" id="chatName">Member</div>
              <div class="msg-chat-sub" id="chatSub">0 messages</div>
            </div>
          </div>
          <div class="msg-chat-body" id="chatBody">
            <div class="msg-chat-empty">
              <i class="bi bi-chat-dots"></i>
              <div>No messages yet</div>
            </div>
          </div>
          <div class="msg-chat-footer">
            <div class="msg-reply-row">
              <textarea id="replyInput" rows="1" placeholder="Type a reply..." onkeydown="handleReplyKeydown(event)"></textarea>
              <button class="btn-send" id="sendBtn" onclick="sendReply()" disabled>
                <i class="bi bi-send-fill"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
buildSidebar('trainer-messages');
if (!getAccessToken()) window.location.href = 'login.html';

// ── State ──────────────────────────────────────────────────────────────
let allMessages = [];
let conversations = {};    // keyed by memberId
let selectedMemberId = null;
const MY_ID = parseInt(localStorage.getItem('user_id')) || 0;

// ── Helpers ────────────────────────────────────────────────────────────
function timeAgo(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if (diff < 60) return 'Just now';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
  return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatDateDivider(dateStr) {
  const d = new Date(dateStr);
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);

  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}

// ── Load messages ──────────────────────────────────────────────────────
async function loadMessages() {
  const res = await apiRequest('/workouts/trainer-messages/');
  if (!res || !res.ok) return;
  allMessages = await res.json();
  groupConversations();
  renderConversationList();
  if (selectedMemberId) renderChat();
}

function groupConversations() {
  conversations = {};
  allMessages.forEach(m => {
    // "Mine" = the sender is the current user
    const isMine = Number(m.sender_id) === MY_ID;
    // If I sent it: other party = recipient_id (the member)
    // If from member: other party = sender_id (the member)
    const memberId = isMine ? m.recipient_id : m.sender_id;
    const memberName = m.sender_name || '';
    if (!memberId) return;
    if (!conversations[memberId]) {
      conversations[memberId] = { name: memberName, messages: [], unread: 0 };
    }
    conversations[memberId].messages.push(m);
    if (!m.is_read && !isMine) conversations[memberId].unread++;
    // Update name from member's messages
    if (!isMine && memberName) conversations[memberId].name = memberName;
  });
}

// ── Render conversation list ───────────────────────────────────────────
function renderConversationList() {
  const el = document.getElementById('conversationList');
  const totalUnread = Object.values(conversations).reduce((s, c) => s + c.unread, 0);
  const badge = document.getElementById('totalUnreadBadge');

  if (totalUnread > 0) {
    badge.textContent = totalUnread;
    badge.classList.remove('d-none');
  } else {
    badge.classList.add('d-none');
  }

  const ids = Object.keys(conversations);
  if (!ids.length) {
    el.innerHTML = '<div class="msg-empty-list"><i class="bi bi-chat-dots"></i>No conversations yet.<br>Members will appear here when they message you.</div>';
    return;
  }

  // Sort by most recent message
  ids.sort((a, b) => {
    const lastA = conversations[a].messages[conversations[a].messages.length - 1];
    const lastB = conversations[b].messages[conversations[b].messages.length - 1];
    return new Date(lastB.created_at) - new Date(lastA.created_at);
  });

  el.innerHTML = ids.map(id => {
    const conv = conversations[id];
    const lastMsg = conv.messages[conv.messages.length - 1];
    const initial = (conv.name || '?').charAt(0).toUpperCase();
    const isActive = selectedMemberId == id;
    const hasUnread = conv.unread > 0;
    const sender = Number(lastMsg.sender_id) === MY_ID ? 'You' : conv.name;
    return `
      <div class="msg-conversation-item ${isActive ? 'active' : ''}" onclick="selectConversation(${id})">
        <div class="msg-conv-avatar">${initial}</div>
        <div class="msg-conv-body">
          <div class="msg-conv-name">
            ${escapeHtml(conv.name)}
            ${hasUnread ? '<span class="badge bg-danger" style="font-size:0.55rem;padding:2px 5px;">NEW</span>' : ''}
          </div>
          <div class="msg-conv-preview"><strong>${escapeHtml(sender)}:</strong> ${escapeHtml(lastMsg.message)}</div>
        </div>
        <div class="msg-conv-meta">
          <div class="msg-conv-time">${timeAgo(lastMsg.created_at)}</div>
          ${hasUnread ? `<div class="msg-conv-unread">${conv.unread}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

// ── Filter conversations by search ─────────────────────────────────────
function filterConversations() {
  const q = document.getElementById('msgSearch').value.toLowerCase().trim();
  document.querySelectorAll('.msg-conversation-item').forEach(item => {
    const name = item.querySelector('.msg-conv-name')?.textContent?.toLowerCase() || '';
    const preview = item.querySelector('.msg-conv-preview')?.textContent?.toLowerCase() || '';
    item.style.display = (!q || name.includes(q) || preview.includes(q)) ? '' : 'none';
  });
}

// ── Select a conversation ──────────────────────────────────────────────
function selectConversation(memberId) {
  selectedMemberId = memberId;
  renderConversationList();
  renderChat();

  // Mark unread messages as read
  const conv = conversations[memberId];
  if (conv) {
    conv.messages.forEach(m => {
      if (!m.is_read && Number(m.sender_id) !== MY_ID) {
        apiRequest(`/notifications/${m.id}/read/`, { method: 'PATCH' });
        m.is_read = true;
      }
    });
    conv.unread = 0;
    renderConversationList();
  }

  // On mobile, hide list and show chat
  if (window.innerWidth <= 900) {
    document.getElementById('msgPage').classList.add('hide-list');
    document.getElementById('msgPage').classList.remove('hide-chat');
  }

  loadTopbarNotifications();
  loadSidebarMessageBadge();
}

// ── Render chat messages ───────────────────────────────────────────────
function renderChat() {
  const conv = conversations[selectedMemberId];
  if (!conv) return;

  document.getElementById('noChatPlaceholder').style.display = 'none';
  const chatView = document.getElementById('chatView');
  chatView.style.display = 'flex';
  chatView.style.flexDirection = 'column';
  chatView.style.height = '100%';

  const initial = (conv.name || '?').charAt(0).toUpperCase();
  document.getElementById('chatAvatar').textContent = initial;
  document.getElementById('chatName').textContent = conv.name;
  document.getElementById('chatSub').textContent = `${conv.messages.length} message${conv.messages.length !== 1 ? 's' : ''}`;

  const body = document.getElementById('chatBody');
  if (!conv.messages.length) {
    body.innerHTML = '<div class="msg-chat-empty"><i class="bi bi-chat-dots"></i><div>No messages yet</div></div>';
    return;
  }

  let lastDate = '';
  body.innerHTML = conv.messages.map(m => {
    const isMember = Number(m.sender_id) !== MY_ID;
    const isTrainer = Number(m.sender_id) === MY_ID;
    const type = isMember ? 'received' : 'sent';
    const senderName = isMember ? conv.name : 'You';

    // Date divider
    const msgDate = new Date(m.created_at).toDateString();
    let divider = '';
    if (msgDate !== lastDate) {
      lastDate = msgDate;
      divider = `<div class="msg-date-divider">${formatDateDivider(m.created_at)}</div>`;
    }

    const time = new Date(m.created_at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

    return `${divider}
      <div class="msg-bubble ${type}">
        <div class="msg-bubble-sender">${escapeHtml(senderName)}</div>
        <div>${escapeHtml(m.message)}</div>
        <div class="msg-bubble-time">${time}</div>
      </div>`;
  }).join('');

  // Scroll to bottom
  body.scrollTop = body.scrollHeight;

  // Enable send button based on input
  document.getElementById('sendBtn').disabled = !document.getElementById('replyInput').value.trim();
}

// ── Send reply ─────────────────────────────────────────────────────────
async function sendReply() {
  const input = document.getElementById('replyInput');
  const msg = input.value.trim();
  if (!msg || !selectedMemberId) return;

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  input.value = '';

  const res = await apiRequest('/workouts/trainer-reply/', {
    method: 'POST',
    body: JSON.stringify({ message: msg, member_id: parseInt(selectedMemberId) }),
  });

  if (res && res.ok) {
    // Add the reply to local state immediately
    const reply = {
      id: Date.now(),  // temporary ID
      title: `Reply from You`,
      message: msg,
      is_read: true,
      read_at: new Date().toISOString(),
      created_at: new Date().toISOString(),
      sender_name: 'You',
      sender_id: null,
      notification_type: 'TRAINER_REPLY',
      related_membership_id: parseInt(localStorage.getItem('user_id')),
      recipient_id: parseInt(selectedMemberId),
    };
    allMessages.push(reply);
    groupConversations();
    renderConversationList();
    renderChat();
  } else {
    if (res) {
      const err = await res.json();
      showToast(err.detail || 'Could not send reply', 'error');
    } else {
      showToast('Could not send reply', 'error');
    }
    input.value = msg;
    btn.disabled = false;
  }
}

function handleReplyKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendReply();
  }
  // Enable/disable send button
  document.getElementById('sendBtn').disabled = !e.target.value.trim();
}

document.getElementById('replyInput').addEventListener('input', function() {
  document.getElementById('sendBtn').disabled = !this.value.trim();
  // Auto-resize textarea
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ── Mobile back button ─────────────────────────────────────────────────
function showListPanel() {
  document.getElementById('msgPage').classList.remove('hide-list');
  document.getElementById('msgPage').classList.add('hide-chat');
}

function showToast(message, variant) {
  const toastEl = document.getElementById("appToast");
  const bodyEl = document.getElementById("appToastBody");
  if (!toastEl || !bodyEl) return;
  toastEl.classList.remove("bg-success", "bg-danger");
  toastEl.classList.add(variant === "error" ? "bg-danger" : "bg-success");
  bodyEl.textContent = message;
  bootstrap.Toast.getOrCreateInstance(toastEl, { delay: 2800 }).show();
}

// ── Init ───────────────────────────────────────────────────────────────
loadMessages();
loadTopbarNotifications();
</script>
</body>
</html>
